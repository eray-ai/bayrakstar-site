  :root{
    --brand:#ff0007;--brand-yazi:#ff0007;--accent:#ffca11;--accent-yazi:#ffca11;--onbrand:#fff;
    --head:'Anton',sans-serif;--body:'Roboto',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:#111;color:#fff;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .head-font{font-family:var(--head)}
  ::selection{background:var(--brand);color:var(--onbrand)}
  img{display:block}

  /* header — radyo.html ile birebir aynı */
  header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;transition:background .4s,padding .4s}
  header.scr{background:rgba(15,15,15,.85);backdrop-filter:blur(14px);padding:10px 5vw}
  .back{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;opacity:.85;transition:opacity .2s}
  .back:hover{opacity:1}
  .back img{height:26px}
  .sib{display:flex;gap:8px;flex-wrap:wrap}
  .sib a{font-size:12px;font-weight:700;padding:7px 13px;border-radius:30px;border:1px solid rgba(255,255,255,.2);opacity:.75;transition:.2s;white-space:nowrap}
  .sib a:hover,.sib a.on{opacity:1;background:var(--brand);border-color:var(--brand);color:var(--onbrand)}

  /* ============ HERO ============ */
  .hero{position:relative;min-height:88vh;display:flex;align-items:center;justify-content:center;
        text-align:center;padding:150px 6vw 90px;overflow:hidden}
  .hero-bg{position:absolute;inset:0;z-index:0}
  .hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.62;transform:scale(1.08);
        animation:kb 20s ease-in-out infinite alternate}
  @keyframes kb{to{transform:scale(1.2)}}
  /* Perde hafif: arkadaki görsel görünsün (bkz. radyo.html'deki aynı düzen). */
  .hero-bg::after{content:"";position:absolute;inset:0;background:
        radial-gradient(120% 90% at 50% 30%,color-mix(in srgb,var(--brand) 32%,transparent),rgba(10,10,10,.62) 78%),
        linear-gradient(180deg,rgba(10,10,10,.22),rgba(10,10,10,.74))}
  .hero-bg::before{content:"";position:absolute;left:0;right:0;bottom:0;height:72%;z-index:1;
        background:linear-gradient(180deg,transparent,rgba(10,10,10,.44) 55%,rgba(10,10,10,.68))}
  .hero-in{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;width:100%;max-width:760px}
  .rlogo{height:44px;width:auto;max-width:230px;object-fit:contain;opacity:.9;margin-bottom:30px;
        filter:drop-shadow(0 6px 20px rgba(0,0,0,.5));animation:rise .8s both}

  /* portre — kare, marka çerçeveli */
  .portre{width:min(230px,52vw);aspect-ratio:1/1;border-radius:28px;overflow:hidden;position:relative;
        border:3px solid var(--brand);box-shadow:0 22px 60px rgba(0,0,0,.6);
        animation:pop 1s cubic-bezier(.2,.9,.3,1.2) both}
  .portre img{width:100%;height:100%;object-fit:cover}
  /* fotoğrafı henüz gelmemiş yayıncı: radyo logolu marka bloğu */
  .portre.fotosuz{display:flex;align-items:center;justify-content:center;
        background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 32%,#161616),#121212)}
  .portre.fotosuz img{width:64%;height:auto;max-height:48%;object-fit:contain;opacity:.5}
  @keyframes pop{from{opacity:0;transform:scale(.84) translateY(18px)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .hero h1{font-family:var(--head);font-size:clamp(34px,7vw,72px);line-height:1.02;margin-top:26px;
        text-transform:uppercase;letter-spacing:.01em;text-shadow:0 2px 24px rgba(0,0,0,.6);
        animation:rise .8s .15s both}
  .hero .prog{font-weight:800;font-size:clamp(15px,2.2vw,20px);color:var(--brand-yazi);margin-top:12px;
        letter-spacing:.02em;animation:rise .8s .28s both}
  .hero .kisa{opacity:.75;font-size:16px;line-height:1.75;margin-top:18px;max-width:560px;
        animation:rise .8s .4s both}
  .hero-btns{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap;justify-content:center;animation:rise .8s .5s both}
  .btn{padding:14px 26px;border-radius:44px;font-weight:800;font-size:14px;cursor:pointer;border:none;
        display:inline-flex;align-items:center;gap:9px;transition:transform .2s,background .2s}
  .btn-fill{background:var(--brand);color:var(--onbrand)}
  .btn-fill:hover{transform:translateY(-3px)}
  .btn-ghost{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.4);color:#fff}
  .btn-ghost:hover{background:rgba(255,255,255,.18);transform:translateY(-3px)}

  /* ============ BÖLÜMLER (radyo.html diliyle) ============ */
  .sec{padding:84px 6vw;position:relative}
  .sec .wrapc{max-width:900px;margin:0 auto}
  .sec h2{font-family:var(--head);font-size:clamp(26px,4.4vw,44px);text-transform:uppercase;
        letter-spacing:.01em;margin-bottom:10px;text-align:center}
  .sec .lead{text-align:center;opacity:.55;margin-bottom:36px;font-size:15px}
  .sec p.metin{font-size:17px;line-height:1.9;opacity:.84;text-align:center}
  .dark{background:#151515}.darker{background:#0d0d0d}

  /* program bölümü: kapak + yazı */
  .prog-kapak{width:100%;max-width:640px;margin:0 auto 30px;border-radius:20px;overflow:hidden;
        border:1px solid rgba(255,255,255,.1);cursor:zoom-in;transition:transform .3s,border-color .3s}
  .prog-kapak:hover{transform:translateY(-4px);border-color:var(--brand)}
  .prog-kapak img{width:100%;height:auto}

  /* galeri */
  .galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .galeri .gk{aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);
        cursor:zoom-in;transition:transform .3s,border-color .3s;background:#181818;padding:0}
  .galeri .gk:hover{transform:translateY(-5px);border-color:var(--brand)}
  .galeri .gk img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .galeri .gk:hover img{transform:scale(1.07)}

  /* diğer yayıncılar */
  .others{padding:80px 5vw 100px;background:#111;text-align:center}
  .others h3{font-family:var(--head);text-transform:uppercase;font-size:24px;margin-bottom:28px;opacity:.85}
  .ogrid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
  .ocard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:18px;
        overflow:hidden;transition:transform .3s,border-color .3s}
  .ocard:hover{transform:translateY(-6px);border-color:var(--brand)}
  .ocard .ph{aspect-ratio:1/1;overflow:hidden;position:relative;background:#181818}
  .ocard .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .ocard:hover .ph img{transform:scale(1.06)}
  .ocard .ph.fotosuz{display:flex;align-items:center;justify-content:center;
        background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 28%,#161616),#121212)}
  .ocard .ph.fotosuz img{width:60%;height:auto;max-height:44%;object-fit:contain;opacity:.42}
  .ocard .in{padding:14px 16px 18px}
  .ocard .nn{font-weight:800;font-size:16px}
  .ocard .ss{color:var(--brand-yazi);font-weight:700;font-size:12.5px;margin-top:3px}
  .geri{margin-top:38px}

  /* bulunamadı */
  .yok{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:120px 8vw 80px;gap:18px}
  .yok h1{font-family:var(--head);font-size:clamp(30px,6vw,54px);text-transform:uppercase}
  .yok p{opacity:.65;font-size:16px;line-height:1.7;max-width:520px}

  /* büyütme katmanı — radyo.html ile birebir aynı */
  #buyut{position:fixed;inset:0;z-index:200;background:rgba(8,8,8,.92);backdrop-filter:blur(6px);
         display:none;align-items:center;justify-content:center;padding:26px;cursor:zoom-out}
  #buyut.acik{display:flex;animation:byt .28s ease}
  @keyframes byt{from{opacity:0}to{opacity:1}}
  #buyut figure{max-width:min(620px,92vw);text-align:center;animation:bytIc .34s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes bytIc{from{transform:scale(.82);opacity:0}to{transform:none;opacity:1}}
  #buyut img{width:100%;height:auto;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6);display:block}
  #buyut figcaption{margin-top:16px;font-weight:800;font-size:17px;letter-spacing:.02em}
  #buyut .kapat{position:absolute;top:20px;right:24px;width:42px;height:42px;border-radius:50%;border:none;
        background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer;line-height:1}
  #buyut .kapat:hover{background:rgba(255,255,255,.26)}

  .reveal{opacity:0;transform:translateY(40px);transition:.8s}
  .reveal.in{opacity:1;transform:none}

  /* ============ ERİŞİLEBİLİRLİK ============ */
  a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
    outline:3px solid #fff;outline-offset:3px;border-radius:8px}
  .skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;color:#111;
    font-weight:800;padding:12px 20px;border-radius:0 0 12px 0}
  .skip:focus{left:0}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
    .hero-bg img{transform:none}
    .reveal{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
<a class="skip" href="#icerik">İçeriğe atla</a>
<header id="hdr">
  <a class="back" href="index.html"><img src="logo/bayrakstar-beyaz.png" alt="Bayrakstar"> <span>← Bayrakstar</span></a>
  <nav class="sib" id="sib" aria-label="Radyolar"></nav>
</header>

<div id="kok"></div>

<script>
window.bulutHazir.then(function(){
const D = window.getSiteData();
const esc = s => (s==null?'':String(s));
const kacir = s => String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* Adresteki ?r= / ?h= değerini okur.
   Statik radyo/yayıncı sayfalarında (r/<slug>/, y/<radyo>-<yayinci>/) sorgu
   parametresi YOKTUR — orada değer sayfaya gömülü ON_SLUG/ON_HOST'tan gelir. */
function q(k){
  var v = new URLSearchParams(location.search).get(k);
  if(v) return v;
  if(k==='r') return window.ON_SLUG || null;
  if(k==='h') return window.ON_HOST || null;
  return null;
}
const KOK_ADRES = 'https://eray-ai.github.io/bayrakstar-site';

/* ---- radyoyu ve yayıncıyı bul ---- */
const radyoSlug = q('r');
const hostSlug  = q('h');
const R = (D.radios||[]).find(x=>x.slug===radyoSlug);
const Y = R ? (R.hosts||[]).find(h=>h && h.slug===hostSlug) : null;

const kok = document.getElementById('kok');

/* ---- bulunamadı: nazik çıkış ---- */
if(!R || !Y){
  document.title = 'Yayıncı bulunamadı — Bayrakstar';
  kok.innerHTML =
    '<div class="yok">'
    + '<h1 class="head-font">Yayıncı bulunamadı</h1>'
    + '<p>Aradığın yayıncı sayfası kaldırılmış ya da adres yanlış olabilir. '
    +   'Aşağıdan radyolarımıza göz atabilirsin.</p>'
    + '<div class="hero-btns">'
    +   (R ? '<a class="btn btn-fill" href="'+URLRadyo(R.slug)+'">'+kacir(R.name)+' sayfası</a>' : '')
    +   '<a class="btn btn-ghost" href="index.html">Ana sayfaya dön</a>'
    + '</div></div>';
  /* header'daki radyo sekmeleri yine dolsun */
  cizSekmeler(null);
  return;
}

/* ---- tema: radyo.html'deki mantığın aynısı ---- */
const rs=document.documentElement.style;
rs.setProperty('--brand',  R.color  || '#ff0007');
rs.setProperty('--accent', R.accent || '#ffca11');
rs.setProperty('--head', "'"+(R.font||'Anton')+"',sans-serif");
rs.setProperty('--body', "'"+(R.bodyFont||'Roboto')+"',sans-serif");
function _lum(hex){hex=String(hex||'').replace('#','');
  if(hex.length===3)hex=hex.split('').map(function(c){return c+c;}).join('');
  var r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;
  return 0.2126*r+0.7152*g+0.0722*b;}
/* Boombox sarısı gibi açık markalarda üstteki yazı siyah olsun */
rs.setProperty('--onbrand', _lum(R.color) > 0.6 ? '#111111' : '#ffffff');

/* marka rengi YAZI olarak koyu zeminde okunmuyorsa tonu koruyup açılır
   (radyo.html'dekiyle aynı yaklaşım) */
(function(){
  function _coz(h){h=String(h||'').replace('#','');
    if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
  function _hex(d){return '#'+d.map(function(v){
    return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
  function _dg(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
  function _isik(d){return 0.2126*_dg(d[0])+0.7152*_dg(d[1])+0.0722*_dg(d[2]);}
  function _oran(a,b){var l1=_isik(a),l2=_isik(b);if(l1<l2){var t=l1;l1=l2;l2=t;}return (l1+0.05)/(l2+0.05);}
  function okunurYap(renk,zemin,hedef){
    var d=_coz(renk),z=_coz(zemin);
    if(!d||!z) return renk;
    if(_oran(d,z)>=hedef) return renk;
    for(var k=0.04;k<=1.0001;k+=0.04){
      var y=[d[0]+(255-d[0])*k,d[1]+(255-d[1])*k,d[2]+(255-d[2])*k];
      if(_oran(y,z)>=hedef) return _hex(y);
    }
    return '#ffffff';
  }
  rs.setProperty('--brand-yazi',  okunurYap(R.color  || '#ff0007','#111111',4.5));
  rs.setProperty('--accent-yazi', okunurYap(R.accent || R.color || '#ffca11','#151515',4.5));
})();

/* ---- SEO / paylaşım etiketleri ---- */
(function(){
  var baslik = Y.name + (Y.show ? ' — ' + Y.show : '') + ' | ' + R.name;
  var ozet = (Y.about || Y.bio || '').replace(/\s+/g,' ').slice(0,180).trim();
  if(!ozet) ozet = Y.name + ', ' + R.name + ' yayıncısı.';
  else if((Y.about || Y.bio || '').length > 180) ozet += '…';
  var adres  = KOK_ADRES + '/' + URLYayinci(R.slug, Y.slug);
  var gorsel = R.slug ? (KOK_ADRES + '/og/' + R.slug + '.jpg') : (KOK_ADRES + '/og/bayrakstar.jpg');
  document.title = baslik;
  function yaz(id,alan,deger){var el=document.getElementById(id); if(el) el.setAttribute(alan,deger);}
  yaz('mDesc','content',ozet);
  yaz('ogTitle','content',baslik);   yaz('twTitle','content',baslik);
  yaz('ogDesc','content',ozet);      yaz('twDesc','content',ozet);
  yaz('ogImage','content',gorsel);   yaz('twImage','content',gorsel);
  yaz('ogImageAlt','content',R.name+' logosu');
  yaz('ogUrl','content',adres);      yaz('canonLink','href',adres);
  var tc=document.querySelector('meta[name="theme-color"]');
  if(tc && R.color) tc.setAttribute('content',R.color);
})();

/* ---- sayfayı çiz ---- */
(function(){
  var kapak  = (Y.cover||'').trim();
  var foto   = (Y.photo||'').trim();
  /* Arka plan için önce radyonun geniş kapağı tercih edilir: yayıncı fotoğrafı
     çoğunlukla kare afiş ve tam ekrana yayılınca üstündeki yazılar dağınık
     duruyor. Portre zaten fotoğrafı gösteriyor. */
  var heroBg = R.hero || R.img || kapak || foto || '';
  /* portre: fotoğraf yoksa radyo logolu marka bloğu (radyo.html'deki gibi) */
  var portre = foto
    ? '<div class="portre"><img src="'+kacir(foto)+'" alt="'+kacir(Y.name)+'" onerror="this.style.opacity=.3"></div>'
    : '<div class="portre fotosuz"><img src="'+kacir(R.logo||'')+'" alt="" aria-hidden="true" '
      + 'onerror="this.style.display=\'none\'"></div>';

  var html = ''
  + '<section class="hero">'
  +   '<div class="hero-bg" aria-hidden="true">'
  +     (heroBg ? '<img src="'+kacir(heroBg)+'" alt="">' : '')
  +   '</div>'
  +   '<div class="hero-in">'
  +     (R.logo ? '<img class="rlogo" src="'+kacir(R.logo)+'" alt="'+kacir(R.name)+' logosu">' : '')
  +     portre
  +     '<h1 class="head-font">'+kacir(Y.name)+'</h1>'
  +     (Y.show ? '<div class="prog">'+kacir(Y.show)+'</div>' : '')
  +     (Y.bio  ? '<div class="kisa">'+kacir(Y.bio)+'</div>' : '')
  +     '<div class="hero-btns">'
  +       '<a class="btn btn-fill" href="radyo.html?r='+kacir(R.slug)+'">'+kacir(R.name)+' sayfası</a>'
  +       (R.url ? '<a class="btn btn-ghost" href="'+kacir(R.url)+'" target="_blank" rel="noopener">Resmî Web Sitesi ↗</a>' : '')
  +     '</div>'
  +   '</div>'
  + '</section>'
  + '<main id="icerik">';

  /* --- Hakkında --- */
  if((Y.about||'').trim()){
    html += '<section class="sec dark reveal">'
      + '<div class="wrapc"><h2 class="head-font">Hakkında</h2>'
      + '<div class="lead">Mikrofonun ardındaki isim</div>'
      + '<p class="metin">'+kacir(Y.about)+'</p></div></section>';
  }

  /* --- Programı --- */
  var progYazi = (Y.program||'').trim();
  if(progYazi || kapak){
    html += '<section class="sec darker reveal">'
      + '<div class="wrapc"><h2 class="head-font">Programı</h2>'
      + (Y.show ? '<div class="lead">'+kacir(Y.show)+'</div>' : '<div class="lead">Yayındaki program</div>')
      + (kapak ? '<div class="prog-kapak" data-buyut="'+kacir(kapak)+'" data-ad="'+kacir(Y.show||Y.name)+'" '
               + 'role="button" tabindex="0" aria-label="Program görselini büyüt">'
               + '<img src="'+kacir(kapak)+'" alt="'+kacir(Y.show||Y.name)+' görseli" loading="lazy"></div>' : '')
      + (progYazi ? '<p class="metin">'+kacir(progYazi)+'</p>' : '')
      + '</div></section>';
  }

  /* --- Galeri --- */
  var galeri = Array.isArray(Y.gallery) ? Y.gallery.filter(function(g){return (g||'').trim();}) : [];
  if(galeri.length){
    html += '<section class="sec dark reveal"><div class="wrapc">'
      + '<h2 class="head-font">Kareler</h2><div class="lead">Yayından ve kulisten</div>'
      + '<div class="galeri">'
      + galeri.map(function(g,i){
          return '<button class="gk" data-buyut="'+kacir(g)+'" data-ad="'+kacir(Y.name)+'" '
               + 'aria-label="'+kacir(Y.name)+' görsel '+(i+1)+' — büyüt">'
               + '<img src="'+kacir(g)+'" alt="" loading="lazy" onerror="this.style.opacity=.2"></button>';
        }).join('')
      + '</div></div></section>';
  }

  /* --- Diğer yayıncılar + geri dönüş --- */
  var digerleri = (R.hosts||[]).filter(function(h){ return h && h.slug && h.slug !== Y.slug; });
  html += '<section class="others">';
  if(digerleri.length){
    html += '<h3 class="head-font">'+kacir(R.name)+' Yayıncıları</h3>'
      + '<div class="ogrid">'
      + digerleri.map(function(h){
          var f=(h.photo||'').trim();
          return '<a class="ocard" href="'+URLYayinci(R.slug,h.slug)+'" '
            + 'aria-label="'+kacir(h.name)+' sayfasına git">'
            + (f ? '<div class="ph"><img src="'+kacir(f)+'" alt="" onerror="this.style.opacity=.3"></div>'
                 : '<div class="ph fotosuz"><img src="'+kacir(R.logo||'')+'" alt="" aria-hidden="true" '
                   + 'onerror="this.style.display=\'none\'"></div>')
            + '<div class="in"><div class="nn">'+kacir(h.name)+'</div>'
            + (h.show?'<div class="ss">'+kacir(h.show)+'</div>':'')+'</div></a>';
        }).join('')
      + '</div>';
  }
  html += '<div class="geri"><a class="btn btn-ghost" href="radyo.html?r='+kacir(R.slug)+'">'
        + '← '+kacir(R.name)+' sayfasına dön</a></div>'
        + '</section></main>';

  kok.innerHTML = html;
})();

/* ---- header'daki radyo sekmeleri ---- */
function cizSekmeler(aktif){
  var sib=document.getElementById('sib');
  (D.radios||[]).forEach(function(r){
    if(!r.slug) return;
    var a=document.createElement('a');
    a.href='radyo.html?r='+r.slug; a.textContent=r.name;
    if(aktif && r.slug===aktif){ a.className='on'; a.setAttribute('aria-current','true'); }
    sib.appendChild(a);
  });
}

/* ---- görsel büyütme katmanı (radyo.html ile aynı davranış) ---- */
(function(){
  var katman=document.createElement('div');
  katman.id='buyut';
  katman.setAttribute('role','dialog');
  katman.setAttribute('aria-modal','true');
  katman.setAttribute('aria-label','Görsel');
  katman.setAttribute('aria-hidden','true');
  katman.innerHTML='<button class="kapat" aria-label="Görseli kapat">×</button>'
    + '<figure><img alt=""><figcaption><span class="ad"></span></figcaption></figure>';
  document.body.appendChild(katman);

  var sonAcan=null;
  function kapat(){
    if(!katman.classList.contains('acik')) return;
    katman.classList.remove('acik');
    katman.setAttribute('aria-hidden','true');
    if(sonAcan){ sonAcan.focus(); sonAcan=null; }
  }
  function ac(src, ad, tetikleyen){
    if(!src) return;
    sonAcan = tetikleyen || document.activeElement;
    var g=katman.querySelector('img');
    g.src=src; g.alt=(ad||'Görsel');
    katman.querySelector('.ad').textContent=ad||'';
    katman.classList.add('acik');
    katman.setAttribute('aria-hidden','false');
    katman.querySelector('.kapat').focus();
  }
  katman.onclick=kapat;
  katman.querySelector('figure').onclick=function(e){ e.stopPropagation(); };
  katman.querySelector('.kapat').onclick=kapat;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') kapat(); });

  /* data-buyut taşıyan her öge (galeri kutuları + program kapağı) */
  document.querySelectorAll('[data-buyut]').forEach(function(el){
    el.addEventListener('click',function(){ ac(el.dataset.buyut, el.dataset.ad, el); });
    if(el.tagName!=='BUTTON'){
      el.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); ac(el.dataset.buyut, el.dataset.ad, el); }
      });
    }
  });
})();
