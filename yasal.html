  .wcard .go{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:14px;background:#fff;color:#111;padding:11px 20px;border-radius:40px;transition:gap .25s}

<main class="sar">
  <h1>Künye ve KVKK</h1>
  <div class="alt" id="ustAlt"></div>
  <div class="icindekiler" id="icindekiler"></div>

  <section class="blok" id="kunye" hidden>
    <h2 id="kBaslik"></h2>
    <p class="giris" id="kAciklama"></p>
    <div class="kt" id="kTablo"></div>
    <p class="not" id="kNot"></p>
  </section>

  <section class="blok" id="kvkk" hidden>
    <h2 id="vBaslik"></h2>
    <p class="giris" id="vGiris"></p>
    <div id="vMaddeler"></div>
    <p class="not" id="vNot"></p>
  </section>

  <div id="bosluk" class="bos-uyari" hidden>Bu sayfa hazırlanıyor.</div>
  <a class="geri" href="index.html">← Ana sayfaya dön</a>

<script src="data.js"></script>
<script src="bulut.js"></script>
<script>
window.bulutHazir.then(function(){
  var D = getSiteData();
  var Y = D.yasal || {};
  function esc(t){ return String(t==null?'':t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var baglar=[];

  /* ---- KÜNYE ---- */
  var K = Y.kunye || {};
  var dolu = (K.alanlar||[]).filter(function(a){ return a && (a.deger||'').trim(); });
  if(K.yayinda && dolu.length){
    document.getElementById('kunye').hidden=false;
    document.getElementById('kBaslik').textContent = K.baslik || 'Künye';
    var ka=document.getElementById('kAciklama');
    if(K.aciklama) ka.textContent=K.aciklama; else ka.style.display='none';
    document.getElementById('kTablo').innerHTML = dolu.map(function(a){
      return '<div class="e">'+esc(a.etiket)+'</div><div class="d">'+esc(a.deger)+'</div>';
    }).join('');
    var kn=document.getElementById('kNot');
    if(K.not) kn.textContent=K.not; else kn.style.display='none';
    baglar.push(['#kunye', K.baslik || 'Künye']);
  }

  /* ---- KVKK ---- */
  var V = Y.kvkk || {};
  if(V.yayinda && (V.bolumler||[]).length){
    document.getElementById('kvkk').hidden=false;
    document.getElementById('vBaslik').textContent = V.baslik || 'KVKK Aydınlatma Metni';
    var vg=document.getElementById('vGiris');
    if(V.giris) vg.textContent=V.giris; else vg.style.display='none';
    document.getElementById('vMaddeler').innerHTML = (V.bolumler||[]).map(function(b){
      /* metinde yalnız <b> gibi basit vurgular var, olduğu gibi basılır */
      return '<div class="madde"><h3>'+esc(b.baslik)+'</h3><p>'+(b.metin||'')+'</p></div>';
    }).join('');
    var vn=document.getElementById('vNot');
    if(V.not) vn.textContent=V.not; else vn.style.display='none';
    baglar.push(['#kvkk', V.baslik || 'KVKK Aydınlatma Metni']);
    if(V.guncelleme) document.getElementById('ustAlt').textContent='Son güncelleme: '+V.guncelleme;
  }

  if(!baglar.length){ document.getElementById('bosluk').hidden=false; }
  document.getElementById('icindekiler').innerHTML =
    baglar.map(function(b){ return '<a href="'+b[0]+'">'+esc(b[1])+'</a>'; }).join('');
});
</script>
<script src="site.js"></script>
