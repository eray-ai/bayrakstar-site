<style>
  :root{
    --dark:#242424;
    --yellow:#ffca11;
    --blue:#0081ba;
    --red:#ff0007;
    --teal:#00bac5;
    --coral:#f75843;
    --paper:#f6f5f2;
    --ink:#1c1c1c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Open Sans',system-ui,sans-serif;background:var(--dark);color:#fff;overflow-x:hidden}
  /* Çalar bandı sabit duruyor; sayfanın en altındaki içerik altında kalmasın */
  body:has(.player.show){padding-bottom:86px}
  @media(max-width:760px){ body:has(.player.show){padding-bottom:78px} }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--coral);color:#fff}
  img{display:block}

  /* ============ HEADER ============ */
  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 5vw;transition:background .4s,padding .4s,backdrop-filter .4s;
  }
  header.scrolled{background:rgba(18,18,18,.82);backdrop-filter:blur(14px);padding:10px 5vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  /* Marka kilidi: logo + altında ortalanmış "colorful life".
     Slogan logodan geniş olmamalı — punto ve harf aralığı buna göre. */
  .brand{display:flex;flex-direction:column;align-items:center;gap:4px}
  .brand img{height:38px;width:auto}
  .brand-slg{font-size:9px;letter-spacing:.12em;opacity:.72;font-weight:400;line-height:1;text-align:center;white-space:nowrap}
  .brand-slg b{font-weight:700}
  @media(max-width:520px){ .brand img{height:32px} .brand-slg{font-size:8px;letter-spacing:.08em} }
  /* Radyo isimleri, radyo sayfalarındaki "diğer radyolarımız" şeridiyle
     aynı hap biçiminde duruyor — iki sayfa arasında tutarlı görünsün. */
  nav.menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  nav.menu a{font-size:12px;font-weight:700;padding:7px 13px;border-radius:30px;
    border:1px solid rgba(255,255,255,.2);opacity:.75;transition:.2s;white-space:nowrap}
  nav.menu a:hover{opacity:1;background:var(--coral);border-color:var(--coral);color:#fff}
  .burger{display:none;flex-direction:column;gap:5px;cursor:pointer}
  .burger span{width:26px;height:3px;background:#fff;border-radius:3px;transition:.3s}

  /* ============ SLIDER ============ */
  .slider{position:relative;height:100vh;min-height:600px;overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;z-index:1}
  .slide.active{opacity:1;z-index:2}
  .slide img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);animation:kb 8s ease-out forwards}
  .slide.active img{animation:kb 8s ease-out forwards}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.24)}}
  /* Karartma hafif: görsel görünsün. Ortadaki yumuşak leke yalnız yazının
     arkasını koyultur, köşelerdeki fotoğraf açık kalır. */
  .slide::after{content:"";position:absolute;inset:0;background:
      radial-gradient(62% 48% at 50% 52%,rgba(10,10,10,.52),rgba(10,10,10,0) 74%),
      radial-gradient(120% 90% at 50% 22%,rgba(20,20,20,.02),rgba(15,15,15,.42) 82%),
      linear-gradient(180deg,rgba(15,15,15,.26),rgba(15,15,15,.18) 42%,rgba(15,15,15,.70))}
  .slider-content{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 6vw 100px}
  .eq-heart{width:186px;height:150px;margin-bottom:26px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));overflow:visible}
  .eq-heart rect{transform-box:fill-box;transform-origin:center}
  /* hareketi azalt tercihi: sabit kalp, animasyon yok */
  @media (prefers-reduced-motion:reduce){.eq-heart{animation:none!important}}
  .kicker{font-size:clamp(14px,1.5vw,18px);letter-spacing:.42em;text-transform:uppercase;font-weight:700;color:var(--yellow);margin-bottom:18px}
  .slider-content h1{font-weight:800;line-height:.98;font-size:clamp(34px,5.6vw,76px);letter-spacing:-.02em;
      text-shadow:0 3px 26px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.4)}
  .slider-content .kicker,.slider-content .slogan{text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .eq-heart{filter:drop-shadow(0 10px 30px rgba(0,0,0,.65))}
  /* Renk geçişli kelime: harf içi saydam olduğu için text-shadow harflerin
     İÇİNDEN görünüp rengi kirletiyor — bu kelimede gölge kapalı. */
  .slider-content h1 .grad{background:linear-gradient(100deg,var(--coral),var(--yellow) 30%,var(--teal) 60%,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;animation:flow 6s linear infinite;text-shadow:none}
  @keyframes flow{to{background-position:200% center}}
  .slogan{font-size:clamp(17px,2.2vw,24px);font-weight:400;opacity:.92;margin-top:20px;letter-spacing:.2em}
  .slogan b{font-weight:700}
  .slider-btns{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;justify-content:center}
  /* Hero'daki radyo logoları — tıklayınca o radyonun sayfasına gider.
     Logoların en/boy oranı çok farklı olduğu için yükseklik marka başına
     ayrı veriliyor (--h); tek yükseklikte Boombox devleşiyor, İstanbul FM
     cılız kalıyor. --ls küçük ekranda hepsini birden küçültür. */
  .hero-logos{display:flex;align-items:center;justify-content:center;gap:clamp(22px,4vw,52px);
    flex-wrap:wrap;margin-top:clamp(52px,7vh,86px);animation:rise .9s .5s both}
  .hero-logos a{display:block;padding:6px;transition:transform .3s,filter .3s;opacity:.94}
  .hero-logos img{height:calc(var(--h,52) * 1px * var(--ls,1));width:auto;display:block;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.55))}
  .hero-logos a:hover{transform:translateY(-6px) scale(1.06);opacity:1}
  .hero-logos a:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:10px}
  @media(max-width:900px){ .hero-logos{--ls:.82;gap:26px} }
  /* Dar ekranda 3+1 kırılıp tek başına kalan logo dengesiz duruyordu → 2x2 */
  @media(max-width:560px){ .hero-logos{--ls:.62;gap:18px 0;max-width:340px;margin-inline:auto}
    .hero-logos a{flex:0 0 50%;display:flex;justify-content:center} }
  @media (prefers-reduced-motion:reduce){ .hero-logos a:hover{transform:none} }
  .btn{padding:15px 30px;border-radius:44px;font-weight:800;font-size:14px;letter-spacing:.03em;transition:transform .25s,box-shadow .25s;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:10px}
  .btn-fill{background:#fff;color:var(--ink)}
  .btn-fill:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(255,255,255,.22)}
  .btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
  .btn-ghost:hover{background:rgba(255,255,255,.16);transform:translateY(-3px)}
  .dots{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px}
  .dots button{width:34px;height:4px;border-radius:4px;border:none;background:rgba(255,255,255,.35);cursor:pointer;transition:.3s;padding:0}
  .dots button.on{background:#fff;width:48px}

  /* ============ RED SLOGAN BAND ============ */
  /* Bant, o an gösterilen sloganın radyosunun rengine yumuşakça geçer.
     Degrade animasyonlanamadığı için zemin DÜZ renk; parlama ayrı katman. */
  .band{background-color:var(--red);position:relative;z-index:10;overflow:hidden;height:66px;display:flex;align-items:center;
        transition:background-color .85s ease,color .85s ease}
  .band::before{content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,0) 52%,rgba(0,0,0,.12))}
  .band .rot{position:relative;width:100%;height:100%;z-index:2}
  .band .sl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(15px,2.2vw,22px)}
  .band .sl.on{opacity:1;transform:none}
  .band .sl .star{width:9px;height:9px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.6)}}

  /* ============ INTRO / TANITIM ============ */
  .intro{background:var(--paper);color:var(--ink);padding:110px 6vw;text-align:center}
  .intro .inner{max-width:900px;margin:0 auto}
  .intro .tag{display:inline-block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;font-weight:800;color:var(--red);margin-bottom:22px}
  .intro h2{font-size:clamp(32px,4.8vw,58px);font-weight:800;line-height:1.06;letter-spacing:-.02em;margin-bottom:26px}
  .intro h2 .c{color:var(--blue)}
  .intro p{font-size:18px;line-height:1.8;color:#444;max-width:720px;margin:0 auto 18px}
  .stats{display:flex;gap:50px;justify-content:center;margin-top:48px;flex-wrap:wrap}
  .stat .num{font-size:48px;font-weight:800;line-height:1}
  .stat .num.c1{color:var(--red)}.stat .num.c2{color:var(--teal)}.stat .num.c3{color:var(--blue)}.stat .num.c4{color:var(--yellow);-webkit-text-stroke:1px #e0a800}
  .stat .lbl{font-size:13px;color:#666;margin-top:8px;letter-spacing:.05em}

  /* ============ RADYOLAR ============ */
  .radios{padding:100px 5vw 110px;background:var(--dark)}
  .radios .head{text-align:center;max-width:640px;margin:0 auto 56px}
  .radios .head h2{font-size:clamp(32px,4.6vw,54px);font-weight:800;letter-spacing:-.02em}
  .radios .head p{opacity:.72;margin-top:14px;font-size:16px;line-height:1.7}
  .radio-grid{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
  .rcard{position:relative;border-radius:24px;overflow:hidden;height:320px;display:block;isolation:isolate;background:#111;transform:translateY(0);transition:transform .4s,box-shadow .4s}
  .rcard:hover{transform:translateY(-8px);box-shadow:0 26px 50px rgba(0,0,0,.5)}
  .rcard .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s;filter:saturate(.85) brightness(.75)}
  .rcard:hover .bg{transform:scale(1.1);filter:saturate(1) brightness(.85)}
  .rcard .tint{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.72;transition:opacity .4s}
  .rcard:hover .tint{opacity:.8}
  .rcard .glow{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.55))}
  .rcard .inner{position:absolute;inset:0;z-index:3;padding:34px;display:flex;flex-direction:column;justify-content:space-between}
  .rcard .top{display:flex;justify-content:space-between;align-items:flex-start}
  /* Logo dosyalarının içindeki şeffaf boşluklar kırpıldı (logo/_ham/ altında ham
     hâlleri duruyor). Artık hepsi AYNI 60px'lik kutuya oturuyor: kutular eşit
     yükseklikte ve aynı hizada başladığı için hem boy hem konum eşitleniyor.
     İçerik oranları farklı olduğundan (Boombox 1.22, İstanbul FM 3.97) genişlik
     doğal olarak değişir — max-width çok uzayanı sınırlar. */
  /* Logolar ORTAK bir bantta dikey ortalanır → konumları birebir aynı hizada.
     Yükseklik marka bazlı: oranlar çok farklı (Boombox 1.22 iki satırlı blok,
     İstanbul FM 3.97 uzun yazı). Hepsine tek yükseklik verilince Boombox cılız,
     İstanbul FM kocaman duruyordu; aşağıdaki değerler optik ağırlığı eşitler. */
  .rcard .top{min-height:78px}
  .rcard .logo{align-self:center;height:60px;width:auto;max-width:196px;object-fit:contain;
    object-position:left center;filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
  .rcard[data-slug="boombox"]    .logo{height:76px}
  .rcard[data-slug="istanbulfm"] .logo{height:52px}
  .rcard[data-slug="fenomen"]    .logo{height:58px}
  .rcard .freq{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);padding:7px 14px;border-radius:30px;font-weight:800;font-size:13px;white-space:nowrap}
  .rcard .bottom .sl{font-size:22px;font-weight:800;letter-spacing:.01em;margin-bottom:14px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  /* mini eq badge */
  .rcard .eqbadge{display:inline-flex;align-items:flex-end;gap:3px;height:16px;margin-left:4px}
  .rcard .eqbadge i{width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite}
  .rcard .eqbadge i:nth-child(2){animation-delay:.2s}.rcard .eqbadge i:nth-child(3){animation-delay:.35s}.rcard .eqbadge i:nth-child(4){animation-delay:.1s}
  .rcard .eqbadge i:nth-child(1){height:40%}.rcard .eqbadge i:nth-child(2){height:90%}.rcard .eqbadge i:nth-child(3){height:60%}.rcard .eqbadge i:nth-child(4){height:100%}
  @keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

  /* ============ İLETİŞİM ============ */
  .contact{background:#1b1b1b;padding:96px 5vw 100px;position:relative;overflow:hidden}
  .contact::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
    background:linear-gradient(90deg,var(--red),var(--coral) 34%,var(--yellow) 55%,var(--teal) 78%,var(--blue))}
  .contact .inner{max-width:1000px;margin:0 auto;text-align:center}
  .contact .tag{display:inline-block;font-size:12px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:800;color:var(--yellow);margin-bottom:18px}
  .contact h2{font-size:clamp(30px,4.4vw,50px);font-weight:800;letter-spacing:-.02em;margin-bottom:34px}
  .contact .lead{opacity:.68;margin:16px auto 44px;font-size:16px;line-height:1.75;max-width:620px}
  /* 4 kalem için 2×2 daha dengeli duruyor; dar ekranda tek sütuna iner */
  .cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;
    text-align:left;max-width:760px;margin:0 auto}
  .ccard{display:flex;align-items:center;gap:15px;background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px 22px;
    transition:transform .25s,border-color .25s,background .25s}
  a.ccard:hover{transform:translateY(-5px);border-color:var(--coral);background:rgba(255,255,255,.075)}
  .ccard .ic{font-size:22px;line-height:1;flex-shrink:0}
  .ccard .tx{min-width:0}
  .ccard .lb{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;font-weight:700}
  .ccard .vl{font-weight:800;font-size:14.5px;margin-top:5px;overflow-wrap:anywhere}
  /* Kurumsal mail kartlarından AYRI duran dinleyici istek hattı bloğu */
  .istek-blok{margin-top:52px;padding-top:44px;position:relative}
  .istek-blok::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:min(280px,60%);height:1px;background:rgba(255,255,255,.14)}
  .istek-blok h3{font-size:clamp(20px,2.6vw,28px);font-weight:800;letter-spacing:-.01em;margin-bottom:24px}
  .istek-blok .lead{margin:12px auto 30px}
  .contact .cnote{opacity:.45;font-size:13px;line-height:1.7;margin-top:30px}

  /* ============ FOOTER ============ */
  footer{background:#161616;padding:70px 5vw 36px}
  .foot-top{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:40px}
  /* Sol alt: yalnız logo — büyük ve ortalı; yazı kaldırıldı (revize 29 Eyl) */
  .foot-brand{display:flex;flex-direction:column;align-items:center;align-self:center}
  .foot-brand img{height:74px}
  .foot-brand p{display:none}
  .foot-radios{display:flex;flex-direction:column;gap:12px}
  .foot-radios h4{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow);margin-bottom:8px;font-weight:800}
  .foot-radios a{opacity:.72;font-size:14px;transition:opacity .2s,transform .2s}
  .foot-radios a:hover{opacity:1;transform:translateX(4px)}
  .socials{display:flex;gap:12px;margin-top:4px}
  .socials a{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;transition:.25s;font-weight:800;font-size:13px}
  .socials a:hover{background:var(--coral);transform:translateY(-3px)}
  .socials a svg{width:18px;height:18px}
  .foot-bottom{max-width:1180px;margin:44px auto 0;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;opacity:.55}

  /* ==== uçan kaçan: floating notes ==== */
  .notes{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
  .notes span{position:absolute;bottom:-50px;color:rgba(255,255,255,.16);animation:floatUp linear infinite;will-change:transform}
  @keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(-118vh) rotate(360deg);opacity:0}}

  /* ==== glow blobs behind radio grid ==== */
  .radios{position:relative;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;animation:drift 16s ease-in-out infinite}
  .b-red{width:360px;height:360px;background:#ec1c24;top:-90px;left:-70px}
  .b-teal{width:320px;height:320px;background:#00bac5;bottom:-80px;right:-50px;animation-delay:-6s}
  .b-blue{width:280px;height:280px;background:#0081ba;top:42%;left:52%;animation-delay:-3s}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(46px,-34px) scale(1.12)}66%{transform:translate(-32px,28px) scale(.94)}}
  .radios .head,.radio-grid{position:relative;z-index:2}

  /* ==== radio card 3D + play ==== */
  .rcard{will-change:transform}
  .rcard .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .rcard .listen,.rcard .site{white-space:nowrap}
  .rcard .listen{display:inline-flex;align-items:center;gap:9px;background:#fff;color:#111;font-weight:800;font-size:14px;padding:12px 20px;border-radius:40px;border:none;cursor:pointer;transition:transform .2s,box-shadow .2s}
  .rcard .listen:hover{transform:scale(1.05);box-shadow:0 10px 26px rgba(255,255,255,.28)}
  .rcard .listen .pi{width:26px;height:26px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}
  .rcard .listen .pi svg{width:12px;height:12px;fill:#fff;margin-left:1px}
  .rcard .site{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:13px;padding:12px 16px;border-radius:40px;border:1.5px solid rgba(255,255,255,.4);transition:background .2s}
  .rcard .site:hover{background:rgba(255,255,255,.16)}
  .rcard .site svg{width:14px;height:14px}
  .rcard.playing{outline:3px solid rgba(255,255,255,.8);outline-offset:-3px}
  /* Sağ üst: yalnız ÇALAN radyonun kartında dönen ses dalgası ("CANLI" yazısı kalktı) */
  .rcard .onair{position:absolute;top:30px;right:30px;z-index:4;display:none;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:30px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
  .rcard .onair i{display:block;width:4px;height:18px;background:#fff;border-radius:3px;animation:eq .9s ease-in-out infinite;transform-origin:center}
  .rcard .onair i:nth-child(2){animation-delay:.2s;height:22px}.rcard .onair i:nth-child(3){animation-delay:.35s}
  .rcard .onair i:nth-child(4){animation-delay:.1s;height:22px}.rcard .onair i:nth-child(5){animation-delay:.28s}
  .rcard.playing .onair{display:flex}
  .rcard.playing .freq{visibility:hidden}
  .rcard.playing .freq{display:none}

  /* ==== STICKY LIVE PLAYER ==== */
  .player{position:fixed;left:0;right:0;bottom:0;z-index:120;transform:translateY(130%);transition:transform .5s cubic-bezier(.2,.85,.25,1)}
  .player.show{transform:translateY(0)}
  .pl-inner{margin:0 auto;max-width:1300px;background:rgba(20,20,20,.94);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:20px 20px 0 0;padding:12px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 -16px 44px rgba(0,0,0,.5)}
  .pl-cover{width:54px;height:54px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
  .pl-cover img{max-width:78%;max-height:78%;object-fit:contain}
  /* şimdi çalıyor: albüm kapağı kutuyu doldurur, radyo logosu köşede rozet olur */
  .pl-cover.art #plLogo{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:cover}
  .pl-roz{display:none;position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:6px;
    background:rgba(10,10,10,.85);padding:2px;object-fit:contain;box-shadow:0 1px 5px rgba(0,0,0,.7)}
  .pl-cover.art .pl-roz{display:block}
  .pl-prog{display:none;height:3px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:7px;overflow:hidden}
  .pl-prog.on{display:block}
  .pl-prog i{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width .95s linear}
  @media (prefers-reduced-motion:reduce){ .pl-prog i{transition:none} }
  .pl-meta{min-width:0;width:200px}
  .pl-name{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-sub{font-size:11px;opacity:.6;margin-top:2px;display:flex;align-items:center;gap:6px}
  .pl-sub .ld{width:7px;height:7px;border-radius:50%;background:var(--red);animation:live 1.5s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(255,0,7,.6)}70%{box-shadow:0 0 0 8px rgba(255,0,7,0)}100%{box-shadow:0 0 0 0 rgba(255,0,7,0)}}
  .pl-play{width:52px;height:52px;border-radius:50%;background:#fff!important;color:#111!important;flex-shrink:0}
  .pl-play svg{width:22px;height:22px;fill:#111}
  .viz{flex:1;display:flex;align-items:center;gap:3px;height:38px;min-width:60px;overflow:hidden;opacity:.35;transition:opacity .3s}
  .player.on .viz{opacity:1}
  .viz i{flex:1;min-width:2px;background:linear-gradient(180deg,var(--teal),var(--blue));border-radius:2px;height:20%;transform-origin:bottom}
  .player.on .viz i{animation:vz .8s ease-in-out infinite}
  @keyframes vz{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
  .pl-vol{display:flex;align-items:center;gap:8px;flex-shrink:0;width:120px}
  .pl-vol svg{width:20px;height:20px;fill:rgba(255,255,255,.7);flex-shrink:0}
  .pl-vol input{width:100%;accent-color:var(--coral);cursor:pointer}
  .pl-close{background:none;border:none;color:#fff;opacity:.5;cursor:pointer;font-size:24px;line-height:1;flex-shrink:0}
  .pl-close:hover{opacity:1}

  /* ==== çoklu radyo bandı ==== */
  .pl-now{display:flex;align-items:center;gap:13px;flex-shrink:0}
  /* Radyo seçilmeden yalnız radyo düğmeleri görünür; biri seçilince
     çalan bilgisi, çal düğmesi ve ses bölümü açılır (revize 29 Eyl). */
  .player:not(.secili) .pl-now,.player:not(.secili) .pl-vol,.player:not(.secili) .pl-close{display:none}
  .player:not(.secili) .pl-strip > :first-child{margin-left:auto}
  .player:not(.secili) .pl-strip > :last-child{margin-right:auto}
  .pl-strip{flex:1;display:flex;gap:8px;overflow-x:auto;padding:3px 2px;min-width:0;scrollbar-width:none}
  .pl-strip::-webkit-scrollbar{height:0}
  .pl-chip{flex-shrink:0;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:40px;padding:5px 15px 5px 5px;cursor:pointer;transition:.2s;color:#fff}
  .pl-chip:hover{background:rgba(255,255,255,.13)}
  .pl-chip.active{border-color:#fff;background:rgba(255,255,255,.18)}
  .pl-chip .cl{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
  .pl-chip .cl img{max-width:78%;max-height:78%;object-fit:contain}
  .pl-chip .cn{font-size:12.5px;font-weight:700;white-space:nowrap}
  .pl-chip .eqm{display:flex;align-items:flex-end;gap:2px;height:12px}
  .pl-chip .eqm i{width:2px;background:#fff;border-radius:2px;height:40%}
  .pl-chip.active .eqm i{animation:vz .7s ease-in-out infinite}
  .pl-chip.active .eqm i:nth-child(2){animation-delay:.15s}.pl-chip.active .eqm i:nth-child(3){animation-delay:.3s}
  /* (telefon düzeni yukarıdaki .pl-inner kuralında toplandı) */

  /* reveal */
  .reveal{opacity:0;transform:translateY(40px);transition:opacity .8s ease,transform .8s ease}
  .reveal.in{opacity:1;transform:none}

  /* ============ ERİŞİLEBİLİRLİK ============ */
  /* klavyeyle gezerken odak nerede belli olsun (fareyle tıklayanı rahatsız etmez) */
  a:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{
    outline:3px solid #fff;outline-offset:3px;border-radius:8px}
  .intro a:focus-visible,.intro button:focus-visible{outline-color:var(--ink)}
  .dots button:focus-visible{outline-offset:5px}

  /* içeriğe atla bağlantısı — yalnız klavyeyle odaklanınca görünür */
  .skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;color:#111;
    font-weight:800;padding:12px 20px;border-radius:0 0 12px 0}
  .skip:focus{left:0}

  /* slider duraklat/oynat düğmesi */
  .slider-pause{position:absolute;bottom:20px;right:5vw;z-index:6;width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.32);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .2s,opacity .2s;opacity:.65}
  .slider-pause:hover{background:rgba(0,0,0,.65);opacity:1}
  .slider-pause svg{width:15px;height:15px;fill:#fff}

  /* Hareketi azalt tercihi: kendiliğinden dönen/uçuşan her şey durur. */
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
      animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
    .slide img{transform:none}
    .reveal{opacity:1!important;transform:none!important}
    .notes{display:none}
  }

  @media(max-width:860px){
    nav.menu{display:none}
    .burger{display:flex}
    .radio-grid{grid-template-columns:1fr}
    .stats{gap:32px}
    .rcard{height:300px}
  }
  @media(max-width:600px){
    /* Dar ekranda iki düğme sığmayıp alt alta düşüyordu; sarma kapatıldı,
       kart iç boşluğu ve düğme ölçüleri sığacak kadar küçültüldü. */
    .rcard .inner{padding:24px}
    .rcard .actions{flex-wrap:nowrap;gap:8px}
    .rcard .listen{font-size:13px;padding:11px 15px;gap:7px}
    .rcard .listen .pi{width:22px;height:22px}
    .rcard .listen .pi svg{width:10px;height:10px}
    .rcard .site{font-size:12px;padding:11px 13px;gap:6px}
    .rcard .site svg{width:14px;height:14px}
    .rcard .top{min-height:70px}
    .rcard .logo{height:54px;max-width:60%}
    .rcard[data-slug="boombox"]    .logo{height:68px}
    .rcard[data-slug="istanbulfm"] .logo{height:47px}
    .rcard[data-slug="fenomen"]    .logo{height:52px}
    .foot-top{flex-direction:column}
  }

  /* çok dar telefonlar (<=360px): düğmeler yine yan yana kalsın diye bir kademe daha */
  @media(max-width:360px){
    .rcard .inner{padding:16px}
    .rcard .actions{gap:6px}
    .rcard .listen{font-size:12px;padding:10px 12px;gap:6px}
    .rcard .site{font-size:11px;padding:10px 11px;gap:5px}
    .rcard .site svg{width:12px;height:12px}
    .rcard .bottom .sl{font-size:19px}
  }

  /* TELEFON: çalar iki satıra açılır.
     1. satır  → albüm kapağı + şarkı/sanatçı + çal + kapat
     2. satır  → radyo logoları (isimsiz, yan yana kaydırılabilir)
     Şarkı bilgisi eskiden telefonda tamamen gizliydi; en değerli bilgi o
     olduğu için artık görünüyor, yerini görselleştirici ve ses kaydırağı
     bırakıyor (dokunmatikte zaten sistem sesi kullanılıyor). */
  @media(max-width:760px){
    .viz,.pl-vol{display:none}
    .pl-inner{flex-wrap:wrap;gap:9px 11px;padding:10px 15px 12px;border-radius:17px 17px 0 0}
    .pl-now{order:1;flex:1 1 auto;min-width:0;gap:11px}
    .pl-meta{width:auto;flex:1;min-width:0;display:block}
    .pl-name{font-size:14px}
    .pl-sub{font-size:10.5px}
    .pl-cover{width:48px;height:48px;border-radius:11px}
    .pl-play{width:46px;height:46px}
    .pl-close{order:1;align-self:center;font-size:22px;padding:0 2px}
    .pl-strip{order:2;flex:1 1 100%;gap:8px}
    .pl-chip{padding:4px;gap:0}
    .pl-chip .cn,.pl-chip .eqm{display:none}
    .pl-chip .cl{width:36px;height:36px}
  }

<script>
window.bulutHazir.then(function(){
const D = window.getSiteData();
const esc = s => (s==null?'':String(s));
/* kullanıcı "hareketi azalt" dediyse kendiliğinden dönen hiçbir şey başlamaz */
const azHareket = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- HERO ---- */
document.getElementById('hKicker').textContent = D.hero.kicker;
document.getElementById('hTitle').innerHTML = esc(D.hero.title1)+'<span class="grad">'+esc(D.hero.accent)+'</span><br>'+esc(D.hero.title2);
document.getElementById('hSlogan').innerHTML = D.hero.slogan;
/* Slogan artık sol üstteki marka kilidinde duruyor; hero'da tekrar etmesin. */
document.getElementById('hSlogan').style.display = 'none';
document.getElementById('brandSlg').innerHTML = D.hero.slogan;

/* Hero'daki radyo logoları — her biri kendi radyo sayfasına gider.
   Slogansız (-sade) sürüm kullanılıyor; küçükken logo içindeki slogan
   okunmuyor, sadece bulanık bir leke oluşturuyordu. */
(function(){
  const YUK = { fenomen:52, fenomenturk:58, boombox:76, istanbulfm:36 };
  const kap = document.getElementById('heroLogos');
  kap.innerHTML = D.radios.map(r=>{
    const href = r.slug ? URLRadyo(r.slug) : r.url;
    const dis  = r.slug ? '' : ' target="_blank" rel="noopener"';
    const src  = r.slug ? 'logo/'+r.slug+'-sade.png' : (r.logo||'');
    const yed  = (r.logo||'').replace(/"/g,'&quot;');
    return '<a href="'+esc(href)+'"'+dis+' style="--h:'+(YUK[r.slug]||52)+'" aria-label="'+esc(r.name)+'">'
         + '<img src="'+esc(src)+'" alt="'+esc(r.name)+'" '
         + 'onerror="if(this.src.indexOf(\'-sade\')>-1){this.src=&quot;'+yed+'&quot;}">'
         + '</a>';
  }).join('');
})();

/* ---- HEADER nav (radyo isimleri) ---- */
const nav=document.getElementById('navMenu');
D.radios.forEach(r=>{const a=document.createElement('a');a.href=r.slug?URLRadyo(r.slug):r.url;if(!r.slug){a.target='_blank';a.rel='noopener';}a.textContent=r.name;nav.appendChild(a);});

/* ---- SLIDER ---- */
const slidesWrap=document.getElementById('slides');
/* İlk görsel hemen (LCP), sonrakiler tembel yüklenir — açılış hafiflesin. */
D.slides.forEach((src,i)=>{const d=document.createElement('div');d.className='slide'+(i===0?' active':'');
  d.innerHTML='<img src="'+esc(src)+'" alt="" decoding="async"'+
              (i===0?' fetchpriority="high"':' loading="lazy"')+'>';
  slidesWrap.appendChild(d);});
const slides=[...slidesWrap.children];
const dotsWrap=document.getElementById('dots');
let si=0;
slides.forEach((_,i)=>{const b=document.createElement('button');if(i===0)b.className='on';
  b.setAttribute('aria-label',(i+1)+'. görsele geç');
  b.setAttribute('aria-current', i===0?'true':'false');
  b.onclick=()=>go(i);dotsWrap.appendChild(b);});
const dots=[...dotsWrap.children];
function go(i){slides[si].classList.remove('active');dots[si].classList.remove('on');dots[si].setAttribute('aria-current','false');
  si=i;slides[si].classList.add('active');dots[si].classList.add('on');dots[si].setAttribute('aria-current','true');
  const im=slides[si].querySelector('img');im.style.animation='none';void im.offsetWidth;im.style.animation='';}

/* --- otomatik geçiş + duraklat/oynat düğmesi --- */
const OYNAT_IKON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const DURAKLAT_IKON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';

function sliderBaslat(){
  if(sliderZaman || slides.length<2) return;

  clearInterval(sliderZaman); sliderZaman=null;
  durBtn.innerHTML=OYNAT_IKON;
  durBtn.setAttribute('aria-label','Görsel geçişini başlat');

/* Slogan hangi radyoya aitse bant o radyonun rengine döner. */
function _rgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function _parlaklik(h){const c=_rgb(h).map(v=>v/255);return .2126*c[0]+.7152*c[1]+.0722*c[2];}

function bandTemasi(s,i){
  const t=String(s||'').toLocaleLowerCase('tr').trim();
  const radyolar=D.radios||[];
  /* önce sloganı birebir eşleştir, tutmazsa sıraya göre eşle */
  let r=radyolar.find(x=>String(x.slogan||'').toLocaleLowerCase('tr').trim()===t);
  if(!r && D.slogans.length<=radyolar.length) r=radyolar[i];
  if(!r||!r.color) return null;
  return { renk:r.color, yazi:_parlaklik(r.color)>.62?'#141414':'#ffffff' };
}
const bandTemalari=D.slogans.map(bandTemasi);

function bandRengiUygula(i){
  if(!band) return;
  const t=bandTemalari[i];
  band.style.backgroundColor = t ? t.renk : '';
  band.style.color           = t ? t.yazi : '';
}
bandRengiUygula(0);

/* Slogan bandı da kendiliğinden döner — hareketi azalt tercihinde
   ilk slogan sabit kalır (bant boş görünmesin diye .on zaten açık). */

  bi=(bi+1)%sls.length;
  sls[bi].classList.add('on');
  bandRengiUygula(bi);
},2600);

}

/* İstatistik rakamları AÇIK kağıt zemine (#f6f5f2) basılıyor; sarı (1.41:1) ve
   turkuaz (2.18:1) orada okunmuyordu. Renk tonu korunup yalnız koyulaştırılarak
   büyük yazı eşiği (3:1) sağlanıyor — zaten yeterli olanlara dokunulmuyor. */
function _coz(h){h=String(h||'').replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return /^[0-9a-fA-F]{6}$/.test(h)?[0,2,4].map(i=>parseInt(h.substr(i,2),16)):null;}
function _dogrusal(c){c/=255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function _isik(d){return 0.2126*_dogrusal(d[0])+0.7152*_dogrusal(d[1])+0.0722*_dogrusal(d[2]);}
function _oran(a,b){let l1=_isik(a),l2=_isik(b);if(l1<l2)[l1,l2]=[l2,l1];return (l1+0.05)/(l2+0.05);}
function koyultKontrastIcin(renk,zeminHex,hedef){
  const d=_coz(renk), z=_coz(zeminHex);
  if(!d||!z) return renk;
  if(_oran(d,z)>=hedef) return renk;
  for(let k=0.04;k<=1.0001;k+=0.04){
    const y=d.map(v=>v*(1-k));
    if(_oran(y,z)>=hedef) return '#'+y.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  }
  return '#1c1c1c';
}
const iStats=document.getElementById('iStats');
D.intro.stats.forEach(s=>{
  const renk = koyultKontrastIcin(s.color||'#1c1c1c','#f6f5f2',3);
  const el=document.createElement('div');el.className='stat';
  el.innerHTML='<div class="num" style="color:'+esc(renk)+'">'+esc(s.num)+'</div><div class="lbl">'+esc(s.label)+'</div>';
  iStats.appendChild(el);
});

/* Çalar bandı sayfa açılır açılmaz görünür — ziyaretçi "nereden dinlerim"

(function(){

// "Canlı Dinle" → bandı aç; ilk yayınlı radyoyu başlat
function openBand(){

  player.classList.add('show');
  if(curIdx<0){ const first=D.radios.findIndex(r=>r.stream&&r.stream.trim()); if(first>=0) playRadio(first); }
}

function playRadio(i,e){
  if(e){e.preventDefault();e.stopPropagation();}
  const r=D.radios[i];
  if(!r) return;
  try{ sessionStorage.removeItem('bs_calar_kapali'); }catch(e2){}
  player.classList.add('show');
  Calar.cal(r);
}
function togglePlay(){
  const d=Calar.aktif();
  if(!d.radyo){ openBand(); return; }
  if(d.caliyor) Calar.duraklat(); else Calar.cal(d.radyo);
}
function closePlayer(){
  Calar.kapat();

}
/* Radyo seçilince çalar paneli açılır. Düz sınıf değişimi her şeyi bir anda
   yerine atıyordu; burada FLIP ile yumuşatılıyor: radyo düğmeleri eski
   yerlerinden yeni yerlerine kayar, bant yüksekliği (telefonda satır ekleniyor)
   akarak değişir, açılan parçalar süzülerek belirir. */
function seciliYap(v){
  if(player.classList.contains('secili')===v) return;
  const inner=player.querySelector('.pl-inner');
  const chips=[...strip.children];
  const once=chips.map(c=>c.getBoundingClientRect());
  const h0=inner.getBoundingClientRect().height;
  player.classList.toggle('secili',v);
  if(azHareket || !player.classList.contains('show') || !inner.animate) return;
  const EASE='cubic-bezier(.2,.85,.25,1)', SURE=650;
  chips.forEach((c,i)=>{
    const s=c.getBoundingClientRect(), dx=once[i].left-s.left, dy=once[i].top-s.top;
    if(Math.abs(dx)>.5||Math.abs(dy)>.5)
      c.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:SURE,easing:EASE});
  });
  const h1=inner.getBoundingClientRect().height;
  if(Math.abs(h1-h0)>.5){
    inner.style.overflow='hidden';
    inner.animate([{height:h0+'px'},{height:h1+'px'}],{duration:SURE,easing:EASE})
      .onfinish=()=>{ inner.style.overflow=''; };
  }
  if(v) inner.querySelectorAll('.pl-now,.pl-vol,.pl-close').forEach((el,i)=>{
    el.animate([{opacity:0,transform:'translateY(10px) scale(.96)'},{opacity:1,transform:'none'}],
      {duration:520,delay:180+i*70,easing:'ease-out',fill:'backwards'});
  });
}
function markActive(i){
  document.querySelectorAll('.pl-chip').forEach(c=>{
    const acik = (+c.dataset.idx===i && isPlaying);
    c.classList.toggle('active',acik);
    c.setAttribute('aria-pressed', acik?'true':'false');
  });
  document.querySelectorAll('.rcard').forEach(c=>c.classList.toggle('playing',+c.dataset.idx===i && isPlaying));
}
function setPlayIcon(p){const b=document.getElementById('plPlay');
  b.innerHTML=p
  ?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>'
  :'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  b.setAttribute('aria-label', p?'Duraklat':'Çal');}

/* ---- ŞİMDİ ÇALIYOR + durum yazıları ----
   Albüm kapağı kutuyu doldurur, radyo logosu köşede rozete iner.
   "Bağlanıyor…" gibi geçici durum yazıları alt satırı devralır. */
function scKapakSifirla(r){
  plCover.classList.remove('art');
  plLogo.onerror=null;
  plLogo.src = r ? r.logo : 'logo/bayrakstar-beyaz.png';
  plLogo.alt='';
}
function scCubuk(){
  const g=plProg.firstElementChild;
  if(!scSarki || scSarki.oran===null || !scSarki.sure){ plProg.classList.remove('on'); g.style.width='0%'; return; }
  const gecen=scSarki.gecen+(Date.now()-scT0)/1000;
  plProg.classList.add('on');
  g.style.width=Math.max(0,Math.min(100,gecen/scSarki.sure*100)).toFixed(1)+'%';
}
function ciz(d){
  const r=d.radyo;
  isPlaying = d.caliyor;
  curIdx = r ? D.radios.findIndex(x=>x.slug===r.slug) : -1;

  player.classList.toggle('on', d.caliyor);
  seciliYap(!!r);
  setPlayIcon(d.caliyor);
  markActive(curIdx);

  if(!r){ plNameEl.textContent='Bir radyo seç'; plSubEl.textContent='Canlı Yayın';
          scKapakSifirla(null); plProg.classList.remove('on'); return; }

  plCover.style.background=r.color;
  if(d.sarki){
    plNameEl.textContent=d.sarki.sarki;
    if(d.sarki.kapak){
      plCover.classList.add('art');
      plLogo.src=d.sarki.kapak; plLogo.alt=d.sarki.sarki;
      plRoz.src=r.logo;
      plLogo.onerror=()=>{ plLogo.onerror=null; scKapakSifirla(r); };
    } else scKapakSifirla(r);
  } else {
    plNameEl.textContent=r.name;
    scKapakSifirla(r);
  }
  plSubEl.textContent = d.durum ? d.durum
    : (d.sarki && d.sarki.sanatci ? d.sarki.sanatci+' · '+r.name : 'Canlı Yayın');
  scCubuk();
}

const birakCalar = Calar.dinle(d=>{
  if(d.sarki !== scSarki){ scSarki=d.sarki; scT0=Date.now(); }
  ciz(d);
});
const cubukSayaci = setInterval(scCubuk,1000);
/* Sayfa değişince bu arayüzün dinleyicisi ve sayacı kapansın — ses sürer. */
window.sayfaTemizligi && window.sayfaTemizligi(()=>{ birakCalar(); clearInterval(cubukSayaci); });

<script>
/* ============================================================
   KALP ⇄ SES DALGASI animasyonu (hero amblemi)
   Dikey barlar önce kalp siluetini doldurur, sonra ekolayzıra
   dönüşüp dans eder, sonra tekrar kalbe döner. Sonsuz döngü.
   ============================================================ */
(function(){
  var svg = document.getElementById('eqHeart');
  if(!svg) return;

  var N     = 15,          // bar sayısı
      GEN   = 150,         // viewBox genişliği
      YUK   = 120,         // viewBox yüksekliği
      ADIM  = GEN/N,       // bar aralığı
      KALIN = 7,           // bar kalınlığı
      MERKEZ= (N-1)/2;

  /* --- 1) Kalp siluetini sütunlara çevir --- */
  var ust = new Array(N).fill(Infinity), alt = new Array(N).fill(-Infinity);
  (function(){
    var S=3.55, CX=GEN/2, CY=51;   // ölçek + konum (kalp 150x120'ye oturur)
    for(var i=0;i<=6000;i++){
      var t=i/6000*Math.PI*2, s=Math.sin(t);
      var hx=16*s*s*s;
      var hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      var X=CX+hx*S, Y=CY-hy*S;
      var k=Math.floor(X/ADIM);
      if(k<0||k>=N) continue;
      if(Y<ust[k]) ust[k]=Y;
      if(Y>alt[k]) alt[k]=Y;
    }
    for(var j=0;j<N;j++){                 // kalbin dışında kalan sütunlar
      if(!isFinite(ust[j])){ ust[j]=CY-4; alt[j]=CY+4; }
    }
  })();

  var kalpMerkez=[], kalpYuk=[];
  for(var i=0;i<N;i++){
    kalpYuk[i]    = Math.max(KALIN, alt[i]-ust[i]);
    kalpMerkez[i] = (ust[i]+alt[i])/2;
  }

  /* --- 2) Barları oluştur (renkler merkeze göre simetrik) --- */
  var RENK=['#ff0007','#f75843','#ffca11','#00bac5','#0081ba'];
  var barlar=[];
  for(var i=0;i<N;i++){
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x', (i*ADIM + (ADIM-KALIN)/2).toFixed(2));
    r.setAttribute('width', KALIN);
    r.setAttribute('rx', KALIN/2);
    r.setAttribute('fill', RENK[Math.round(Math.abs(i-MERKEZ)) % RENK.length]);
    svg.appendChild(r);
    barlar.push(r);
  }

  function ciz(merkez, yuk){
    for(var i=0;i<N;i++){
      var h=Math.max(KALIN, yuk[i]);
      barlar[i].setAttribute('y', (merkez[i]-h/2).toFixed(2));
      barlar[i].setAttribute('height', h.toFixed(2));
    }
  }

  /* Hareket azaltma tercihi: sabit kalp çiz, bitir */
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    ciz(kalpMerkez, kalpYuk); return;
  }

  /* --- 3) Zaman çizelgesi (ms) --- */
  var KALP_BEKLE=1900, DONUS=850, DALGA_SURE=3000, TUR=KALP_BEKLE+DONUS+DALGA_SURE+DONUS;

  function yumusat(p){ return p<.5 ? 4*p*p*p : 1-Math.pow(-2*p+2,3)/2; }  // easeInOutCubic

  /* dalga durumu: ortada hizalı, zamanla dans eden ekolayzır */
  function dalga(t, i){
    var f = i/(N-1)*Math.PI*2;
    var a = Math.sin(t/260 + f*1.7)*0.5 + Math.sin(t/150 + f*2.9)*0.32 + Math.sin(t/95 + f*1.1)*0.18;
    var kenar = 1 - Math.pow(Math.abs(i-MERKEZ)/MERKEZ, 2)*0.45;   // kenarlar biraz kısa
    return (26 + a*30) * kenar;
  }

  var t0=null;
  function kare(zaman){
    if(t0===null) t0=zaman;
    var t=(zaman-t0), p=t % TUR;

    var karisim;            // 0 = tam kalp, 1 = tam dalga
    var atis=0;             // kalp atışı (nabız)
    if(p < KALP_BEKLE){
      karisim=0;
      var q=(p/KALP_BEKLE)*2*Math.PI;                       // lub-dub nabzı
      atis=(Math.sin(q)*0.5+Math.sin(q*2)*0.28)*0.045;
    } else if(p < KALP_BEKLE+DONUS){
      karisim=yumusat((p-KALP_BEKLE)/DONUS);
    } else if(p < KALP_BEKLE+DONUS+DALGA_SURE){
      karisim=1;
    } else {
      karisim=1-yumusat((p-KALP_BEKLE-DONUS-DALGA_SURE)/DONUS);
    }

    var merkez=[], yuk=[];
    for(var i=0;i<N;i++){
      var dm=YUK/2, dy=dalga(t,i);
      merkez[i]=kalpMerkez[i]+(dm-kalpMerkez[i])*karisim;
      yuk[i]   =kalpYuk[i]  +(dy-kalpYuk[i])  *karisim;
    }
    ciz(merkez,yuk);
    svg.style.transform='scale('+(1+atis*(1-karisim))+')';

    if(!durduruldu) requestAnimationFrame(kare);
  }
  /* Sayfa değişince döngü kendini kapatsın — yoksa arkada boşuna dönerdi. */
  var durduruldu=false;
  window.sayfaTemizligi && window.sayfaTemizligi(function(){ durduruldu=true; });
  ciz(kalpMerkez,kalpYuk);
  requestAnimationFrame(kare);
})();
</script>
