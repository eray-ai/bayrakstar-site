<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radyo Web Siteleri — Bayrakstar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="bulut.js"></script>
<style>
  :root{--yellow:#ffca11;--blue:#0081ba;--red:#ff0007;--teal:#00bac5;--coral:#f75843;--dark:#1c1c1c}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Open Sans',system-ui,sans-serif;background:var(--dark);color:#fff;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  img{display:block}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 6vw}
  header .back{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;opacity:.85;transition:opacity .2s}
  header .back:hover{opacity:1}
  header .back img{height:32px}

  .hero{text-align:center;padding:40px 6vw 20px}
  .hero .kick{font-size:12px;letter-spacing:.4em;text-transform:uppercase;font-weight:700;color:var(--yellow);margin-bottom:16px}
  .hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
  .hero p{opacity:.7;margin-top:16px;font-size:16px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.7}

  .wrap{flex:1;max-width:1000px;margin:0 auto;padding:40px 6vw 90px;width:100%}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .wcard{position:relative;border-radius:22px;overflow:hidden;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
    padding:28px;isolation:isolate;transition:transform .3s,box-shadow .3s;border:1px solid rgba(255,255,255,.08)}
  .wcard:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.45)}
  .wcard .bgc{position:absolute;inset:0;z-index:-2;opacity:.16}
  .wcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 120% at 0% 0%,rgba(255,255,255,.06),transparent)}
  .wcard .logo{height:52px;width:auto;max-width:70%;object-fit:contain;object-position:left;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
  .wcard .bot{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
  .wcard .u{font-size:13px;opacity:.7}
  .wcard .go{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:14px;background:#fff;color:#111;padding:11px 20px;border-radius:40px;transition:gap .25s}
  .wcard:hover .go{gap:14px}
  .wcard .go svg{width:15px;height:15px}
  .note{text-align:center;opacity:.5;font-size:13px;margin-top:34px}
  footer{text-align:center;padding:26px;opacity:.5;font-size:13px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html"><img src="logo/bayrakstar-beyaz.png" alt="Bayrakstar"> <span>← Ana Sayfa</span></a>
</header>

<section class="hero">
  <div class="kick">Resmî Web Siteleri</div>
  <h1>Hangi radyoya gitmek istersin?</h1>
  <p>Aşağıdan bir radyo seç; o radyonun resmî web sitesine yönlendirileceksin.</p>
</section>

<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="note">Bağlantılar yeni sekmede açılır. Radyolar hakkında bilgi için ana sayfadaki sayfaları ziyaret edebilirsin.</div>
</div>

<footer>© 2026 Bayrakstar — colorful life</footer>

<script>
window.bulutHazir.then(function(){
const D = window.getSiteData();
const esc = s => (s==null?'':String(s));
const grid = document.getElementById('grid');
D.radios.forEach(r=>{
  const a=document.createElement('a');
  a.className='wcard';
  a.href=r.url; a.target='_blank'; a.rel='noopener';
  a.style.background='linear-gradient(135deg,'+(r.color==='#111111'?'#242424':r.color)+'22,#181818)';
  const host=(r.url||'').replace(/^https?:\/\//,'').replace(/\/$/,'');
  a.innerHTML=
    '<div class="bgc" style="background:'+esc(r.color)+'"></div>'+
    '<img class="logo" src="'+esc(r.logo)+'" alt="'+esc(r.name)+'">'+
    '<div class="bot"><span class="u">'+esc(host)+'</span>'+
    '<span class="go">Siteye Git <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H8M17 7v9"/></svg></span></div>';
  grid.appendChild(a);
});
});
</script>
<script src="site.js"></script>
</body>
</html>
