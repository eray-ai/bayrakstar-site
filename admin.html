<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- GitHub Pages özel HTTP başlığı gönderemediği için güvenlik
     kuralı (CSP) sayfanın içine gömüldü. Yeni radyo eklersen
     yayın adresini media-src VE connect-src listelerine ekle. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://live.radyofenomen.com https://yayin.radyoboombox.com.tr https://yayin.istanbulfm.com.tr; connect-src 'self' https://bezwdlxombiirihxomnv.supabase.co https://live.radyofenomen.com https://yayin.radyoboombox.com.tr https://yayin.istanbulfm.com.tr; worker-src 'self' blob:; manifest-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayrakstar — Yönetim Paneli</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="data.js"></script>
<!-- Panel bayat kopya üzerinde düzenleme yapıp yeni içeriği ezmesin:
     ön bellek olsa bile bulut HER ZAMAN taze okunur. -->
<script>window.BULUT_TAZE_SART = true;</script>
<script src="bulut.js"></script>
<style>
  :root{--red:#ff0007;--coral:#f75843;--blue:#0081ba;--teal:#00bac5;--yellow:#ffca11;--ink:#1c1c1c;--line:#e6e4df;--bg:#f2f1ee}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  a{color:var(--blue)}

  /* login */
  #gate{position:fixed;inset:0;background:#1d1d1d;display:flex;align-items:center;justify-content:center;z-index:50}
  #gate .box{background:#262626;padding:44px 40px;border-radius:20px;width:340px;text-align:center;color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.4)}
  #gate h1{font-size:20px;font-weight:800;margin-bottom:6px}
  #gate p{opacity:.6;font-size:13px;margin-bottom:22px}
  #gate input{width:100%;padding:13px 16px;border-radius:10px;border:1px solid #3a3a3a;background:#1d1d1d;color:#fff;font-size:15px;margin-bottom:14px}
  #gate button{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(120deg,var(--red),var(--coral));color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  #gate .err{color:#ff6b6b;font-size:13px;height:16px;margin-top:8px}

  /* topbar */
  header{position:sticky;top:0;z-index:25;background:#1d1d1d;color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header .l{display:flex;align-items:center;gap:14px}
  header img{height:28px}
  header .t{font-weight:800;letter-spacing:.02em;font-size:15px}
  header .t small{display:block;font-weight:400;opacity:.55;font-size:11px;letter-spacing:.1em}
  .actions{display:flex;gap:9px;flex-wrap:wrap}
  .btn{padding:10px 18px;border-radius:9px;border:none;font-weight:800;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.2s}
  .btn:hover{transform:translateY(-1px)}
  .btn-primary{background:linear-gradient(120deg,var(--red),var(--coral));color:#fff}
  .btn-dark{background:#3a3a3a;color:#fff}
  .btn-ghost{background:transparent;color:#fff;border:1px solid #4a4a4a}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:7px}
  /* içerik boyutu rozeti */
  .rozet{display:inline-flex;align-items:center;padding:7px 12px;border-radius:7px;font-size:12px;
         font-weight:700;letter-spacing:.01em;cursor:help;border:1px solid transparent;white-space:nowrap}
  .rozet.iyi {background:rgba(45,190,110,.14);color:#5ede9c;border-color:rgba(45,190,110,.32)}
  .rozet.orta{background:rgba(240,175,50,.16);color:#ffc75c;border-color:rgba(240,175,50,.36)}
  .rozet.kotu{background:rgba(226,60,60,.18);color:#ff8080;border-color:rgba(226,60,60,.42)}

  /* ---- İKİ SÜTUNLU KABUK ---- */
  .shell{display:flex;align-items:flex-start;gap:24px;max-width:1260px;margin:0 auto;padding:22px 20px 120px}
  .side{width:262px;flex:0 0 262px;position:sticky;top:70px}
  .panel{flex:1;min-width:0}

  /* radyo seçici (sol üst, açılır) */
  .switcher{position:relative;margin-bottom:14px}
  .sw-btn{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;text-align:left;color:var(--ink);transition:.15s}
  .sw-btn:hover{border-color:#c9c6bf}
  .sw-btn .sw-lbl{display:block;font-size:10px;font-weight:700;color:#a09c94;letter-spacing:.09em;text-transform:uppercase;margin-bottom:2px}
  .sw-btn .sw-mid{flex:1;min-width:0}
  .sw-btn .sw-nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sw-caret{font-size:11px;color:#999;transition:transform .2s}
  .switcher.open .sw-caret{transform:rotate(180deg)}
  .dot{width:16px;height:16px;border-radius:5px;flex:0 0 16px}
  .sw-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 20px 44px rgba(0,0,0,.16);padding:6px;z-index:30;display:none}
  .switcher.open .sw-menu{display:block}
  .sw-menu button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;padding:10px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#333;text-align:left}
  .sw-menu button:hover{background:#f4f4f2}
  .sw-menu button.on{background:#eef6fb;color:var(--blue)}
  .sw-sep{height:1px;background:var(--line);margin:6px 4px}

  /* bölüm menüsü */
  .snav{background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px}
  .snav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;padding:11px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:#4a4a4a;text-align:left;transition:.12s}
  .snav button:hover{background:#f4f4f2}
  .snav button.on{background:var(--ink);color:#fff}
  .snav .ico{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:0 0 24px}
  .snav .say-adet{margin-left:auto;font-size:11px;font-weight:800;opacity:.5}

  /* mobil aç/kapa */
  .side-toggle{display:none;width:100%;margin-bottom:12px}

  /* kartlar */
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
  .card > h2{font-size:19px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
  .card > h2 .ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
  .card > .desc{font-size:13px;color:#777;margin-bottom:20px;line-height:1.55}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#555;margin-bottom:6px;letter-spacing:.02em}
  .lim{font-weight:600;color:#a8a49c;font-size:11px;letter-spacing:0}
  .say{margin-left:auto;font-size:11px;font-weight:800;color:#b5b1a9;letter-spacing:0}
  .say.yakin{color:#d98324}
  .say.asti{color:#d33}
  .say-mini{margin-left:0;flex:0 0 auto;font-size:10px;min-width:42px;text-align:right;transition:opacity .2s}

  /* biçimlendirme araçları + canlı önizleme */
  .arac{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap;align-items:center}
  .arac button{background:#f2f1ee;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;color:#555;transition:.12s}
  .arac button:hover{background:#e7e6e2;border-color:#cfccc5}
  /* renk paleti */
  .palet{display:flex;gap:4px;align-items:center;background:#f2f1ee;border:1px solid var(--line);border-radius:7px;padding:4px 7px}
  .palet .plbl{font-size:11px;font-weight:800;color:#555;margin-right:3px}
  .palet .swatch{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);cursor:pointer;padding:0;transition:transform .12s}
  .palet .swatch:hover{transform:scale(1.18)}
  .palet .ozel{width:20px;height:20px;border:none;border-radius:50%;padding:0;cursor:pointer;background:conic-gradient(#ff0007,#ffca11,#00bac5,#0081ba,#f75843,#ff0007);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
  .palet input[type=color]{width:0;height:0;opacity:0;position:absolute;pointer-events:none}
  /* WYSIWYG yazı kutusu — sitenin koyu zeminini taklit eder,
     yazdığın şey birebir sitede göründüğü gibi durur */
  .yaz{background:#1d1d1d;color:#fff;border:1px solid #333;border-radius:11px;
       padding:14px 17px;font-size:16px;line-height:1.55;min-height:52px;
       word-break:break-word;outline:none;transition:border-color .15s;cursor:text}
  .yaz.uzun{min-height:96px}
  .yaz:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,129,186,.18)}
  .yaz.asti{border-color:#d33}
  .yaz b{font-weight:800}
  .yaz .c{color:#49a6d6}          /* eski içerikteki mavi sınıf */
  .yaz:empty:before{content:attr(data-bos);color:#666}
  input[type=text],input[type=url],textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fafafa}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);background:#fff}
  input.asti,textarea.asti{border-color:#e39c9c;background:#fff8f8}
  textarea{resize:vertical;min-height:70px;line-height:1.5}
  .field{margin-bottom:16px}
  .hint{font-size:11px;color:#999;margin-top:5px;line-height:1.5}
  .oneri{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#2b7a8a;background:#e8f4f7;border:1px solid #c5e3ea;border-radius:7px;padding:5px 9px;margin-top:6px}
  .color-inp{display:flex;align-items:center;gap:8px}
  .color-inp input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:2px;cursor:pointer}

  /* liste öğeleri */
  .item{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:#fcfcfb;position:relative}
  .item .ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .item .ihead .n{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
  .item .ihead .ctrl{display:flex;gap:6px}
  .thumb{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eee;margin-top:8px}
  .thumb.logo{height:60px;object-fit:contain;background:#333;padding:8px}
  .simple-list .sitem{display:flex;gap:10px;margin-bottom:10px;align-items:center}
  .simple-list .sitem input{flex:1}
  .add{background:#eef6fb;color:var(--blue);border:1px dashed var(--blue);width:100%;padding:12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .del{background:#fdeaea;color:#d33;border:none;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .mv{background:#eee;border:none;border-radius:7px;padding:6px 9px;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit}
  .git{background:#eef6fb;color:var(--blue);border:1px solid #c9e3f0;border-radius:7px;padding:6px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
  .rowline{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .rowline input{flex:1;min-width:90px}
  .subcard{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;background:#fff}
  .subcard textarea{margin:8px 0;min-height:52px}

  /* yükleme */
  .uprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .uprow input[type=text]{flex:1;min-width:160px}
  .btn-up{background:#eaf4ea;color:#2b8a3e;border:1px solid #b6e0b6;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;font-family:inherit}
  .btn-up:hover{background:#d9edd9}
  .chip{flex:1;min-width:160px;background:#eaf4ea;color:#2b8a3e;border:1px solid #b6e0b6;border-radius:8px;padding:10px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
  .btn-x{background:#f1f1f1;border:1px solid #ddd;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit}

  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(120%);background:#1d1d1d;color:#fff;padding:14px 24px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;transition:transform .4s;box-shadow:0 14px 34px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px}
  #toast.show{transform:translateX(-50%) translateY(0)}
  #toast .ok{width:9px;height:9px;border-radius:50%;background:#3ddc84}
  #toastGeri{display:none;background:#3ddc84;color:#12331f;border:none;border-radius:8px;
             padding:7px 13px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;margin-left:6px}
  #toastGeri:hover{background:#54e695}

  .stat-row{display:grid;grid-template-columns:1fr 1.6fr auto auto;gap:10px;align-items:center;margin-bottom:10px}
  .bos{text-align:center;color:#a09c94;font-size:13px;padding:26px 10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:14px}

  @media(max-width:900px){
    .shell{flex-direction:column;gap:0}
    .side{width:100%;flex:none;position:static;margin-bottom:14px}
    .side-toggle{display:block}
    .side-body{display:none}
    .side-body.acik{display:block}
  }
  @media(max-width:640px){.grid2{grid-template-columns:1fr}.stat-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- GİRİŞ -->
<div id="gate">
  <div class="box">
    <h1>Bayrakstar Yönetim</h1>
    <p>Devam etmek için şifre girin</p>
    <p style="font-size:12px;opacity:.55;margin-top:-14px">Kaydettiklerin doğrudan yayına gider</p>
    <input type="password" id="pw" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">Giriş Yap</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ÜST BAR -->
<header>
  <div class="l">
    <img src="logo/bayrakstar-beyaz.png" alt="Bayrakstar">
    <div class="t">Yönetim Paneli<small>colorful life</small></div>
  </div>
  <div class="actions">
    <span id="boyutRozet" class="rozet iyi">İçerik: —</span>
    <button class="btn btn-ghost btn-sm" onclick="resetAll()">↺ Sıfırla</button>
    <button class="btn btn-dark btn-sm" onclick="importJson()">⬆ JSON Yükle</button>
    <button class="btn btn-dark btn-sm" onclick="exportJson()">⬇ JSON İndir</button>
    <button class="btn btn-primary" onclick="saveAndPreview()">☁️ Kaydet &amp; Yayınla</button>
  </div>
</header>

<!-- KABUK -->
<div class="shell" id="app" style="display:none">
  <aside class="side">
    <button class="btn btn-dark side-toggle" onclick="document.getElementById('sideBody').classList.toggle('acik')">☰ Menü</button>
    <div id="sideBody" class="side-body">
      <!-- radyo seçici -->
      <div class="switcher" id="switcher">
        <button class="sw-btn" onclick="switcherAc(event)">
          <span class="dot" id="swDot"></span>
          <span class="sw-mid">
            <span class="sw-lbl">Düzenlenen</span>
            <span class="sw-nm" id="swName">Bayrakstar</span>
          </span>
          <span class="sw-caret">▼</span>
        </button>
        <div class="sw-menu" id="swMenu"></div>
      </div>
      <!-- bölümler -->
      <nav class="snav" id="snav"></nav>
    </div>
  </aside>

  <main class="panel" id="panel"></main>
</div>

<div id="toast"><span class="ok"></span><span id="toastMsg">Kaydedildi</span><button id="toastGeri" onclick="geriAl()">↩ Geri al</button></div>

<script>
/* ==== GİRİŞ (Supabase Auth) ==== */
function login(){
  const btn=document.querySelector('#gate button');
  const err=document.getElementById('loginErr');
  const v=document.getElementById('pw').value;
  err.textContent=''; btn.disabled=true; btn.textContent='Giriş yapılıyor…';
  window.BULUT.giris(v).then(function(){
    btn.disabled=false; btn.textContent='Giriş Yap'; openPanel();
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Giriş Yap';
    err.textContent = /fetch|network|Failed/i.test(e.message)
      ? 'Bulut sunucusuna ulaşılamadı — internet bağlantını kontrol et.' : 'Şifre yanlış.';
  });
}
function openPanel(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  window.bulutHazir.then(function(){
    D = JSON.parse(JSON.stringify(window.getSiteData()));
    render();
  });
}

/* ==== VERİ ==== */
const KNOWN_LOGOS=[
  "logo/fenomen-beyaz.png","logo/fenomen-renkli.png",
  "logo/fenomenturk-beyaz.png","logo/fenomenturk-renkli.png",
  "logo/boombox-beyaz.png","logo/boombox-renkli.png",
  "logo/istanbulfm-beyaz.png","logo/istanbulfm-renkli.png",
  "logo/bayrakstar-beyaz.png"
];
let D = JSON.parse(JSON.stringify(window.getSiteData()));

/* ============================================================
   YOL OKUYUCU / YAZICI
   Panel içindeki alanlar "D.radios[0].hosts[2].photo" gibi metin
   yollarla veriye bağlanır. Eskiden bu yollar new Function() ile
   çalıştırılıyordu; güvenlik başlığı (CSP) kod üretimini yasakladığı
   için aynı iş burada elle çözülüyor.
   ============================================================ */
function _yolParcala(yol){
  return String(yol||'')
    .replace(/^D\.?/, '')          // baştaki "D." at
    .replace(/\[(\d+)\]/g, '.$1')  // [3] → .3
    .split('.')
    .filter(function(p){ return p !== ''; });
}
function yolOku(yol){
  var o = D, p = _yolParcala(yol);
  for (var i = 0; i < p.length; i++){
    if (o == null) return undefined;
    o = o[p[i]];
  }
  return o;
}
function yolYaz(yol, deger){
  var p = _yolParcala(yol);
  if (!p.length) return;
  var o = D;
  for (var i = 0; i < p.length - 1; i++){
    if (o[p[i]] == null) o[p[i]] = /^\d+$/.test(p[i+1]) ? [] : {};
    o = o[p[i]];
  }
  o[p[p.length - 1]] = deger;
}

/* ==== ÖNERİLEN GÖRSEL BOYUTLARI ==== */
const GORSEL = {
  slide:   {ol:'1920 × 1080 px', tip:'JPG · yatay (16:9)', not:'Ana sayfa tam ekran kayar görsel. Ortada yazı olduğu için sade, koyu görseller daha iyi durur.'},
  kart:    {ol:'1200 × 800 px',  tip:'JPG · yatay (3:2)',  not:'Ana sayfadaki radyo kartının arka planı. Üzerine logo ve yazı biner.'},
  kapak:   {ol:'1920 × 900 px',  tip:'JPG · geniş yatay',  not:'Radyo sayfasının tepesindeki kapak. Üstü koyu filtreyle kaplanır.'},
  logo:    {ol:'600 × 200 px',   tip:'şeffaf PNG',         not:'Koyu zemine bindiği için beyaz/açık renkli logo kullan.'},
  yayinci: {ol:'600 × 600 px',   tip:'JPG · KARE (1:1)',   not:'Kart kare olduğu için kare olmayan görselin kenarları kırpılır.'},
  program: {ol:'600 × 600 px',   tip:'JPG · KARE (1:1)',   not:'Akışta küçük kare olarak görünür, tıklanınca büyür. Boş bırakırsan radyonun logosu kullanılır.'}
};
function oneriKutu(g){
  return '<div class="oneri">🖼️ Önerilen: <b>'+g.ol+'</b> · '+g.tip+'</div><div class="hint">'+g.not+'</div>';
}

/* ==== BÖLÜM TANIMLARI ==== */
const B_SITE=[
  {id:'hero',    ad:'Hero / Karşılama',  ikon:'◆', renk:'#f75843'},
  {id:'slider',  ad:'Slider Görselleri', ikon:'▦', renk:'#00bac5', say:()=>D.slides.length},
  {id:'bant',    ad:'Kırmızı Bant',      ikon:'✱', renk:'#ff0007', say:()=>D.slogans.length},
  {id:'tanitim', ad:'Tanıtım & İstatistik',ikon:'¶',renk:'#0081ba'},

/* ==== DURUM: hangi varlık + hangi bölüm ==== */
let st = { varlik:'site', radyo:0, bolum:'hero' };

function bolumler(){ return st.varlik==='site' ? B_SITE : B_RADYO; }

/* ==== SEÇİCİ (sol üst açılır panel) ==== */
function switcherAc(e){ e.stopPropagation(); document.getElementById('switcher').classList.toggle('open'); }
document.addEventListener('click', function(){ const s=document.getElementById('switcher'); if(s) s.classList.remove('open'); });

function cizSecici(){
  const m=document.getElementById('swMenu');
  let h='<button class="'+(st.varlik==='site'?'on':'')+'" onclick="gecVarlik(\'site\')">'
      + '<span class="dot" style="background:linear-gradient(120deg,#ff0007,#ffca11,#00bac5)"></span> Bayrakstar <span style="opacity:.5;font-weight:600">· site geneli</span></button>'
      + '<div class="sw-sep"></div>';
  D.radios.forEach(function(r,i){
    h+='<button class="'+(st.varlik==='radyo'&&st.radyo===i?'on':'')+'" onclick="gecVarlik(\'radyo\','+i+')">'
      +'<span class="dot" style="background:'+att(r.color||'#888')+'"></span> '+att(r.name||'Radyo')+'</button>';
  });
  m.innerHTML=h;
  const site = st.varlik==='site';
  document.getElementById('swName').textContent = site ? 'Bayrakstar' : (D.radios[st.radyo]||{}).name || 'Radyo';
  document.getElementById('swDot').style.background = site
    ? 'linear-gradient(120deg,#ff0007,#ffca11,#00bac5)'
    : ((D.radios[st.radyo]||{}).color || '#888');
}
function gecVarlik(v,i){
  st.varlik=v;
  if(v==='radyo') st.radyo=i;
  st.bolum = bolumler()[0].id;
  document.getElementById('switcher').classList.remove('open');
  render();
}
function gecBolum(id){ st.bolum=id; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ==== SOL BÖLÜM MENÜSÜ ==== */
function cizMenu(){
  const n=document.getElementById('snav');
  n.innerHTML = bolumler().map(function(b){
    let adet='';
    if(b.say){ const s = st.varlik==='site' ? b.say() : b.say(st.radyo); adet='<span class="say-adet">'+s+'</span>'; }
    return '<button class="'+(st.bolum===b.id?'on':'')+'" onclick="gecBolum(\''+b.id+'\')">'
         + '<span class="ico" style="background:'+b.renk+'">'+b.ikon+'</span>'+b.ad+adet+'</button>';
  }).join('');
}

/* ==== ANA ÇİZİM ==== */
function render(){ cizSecici(); cizMenu(); cizPanel(); sayaclariKur(); editorleriKur(); guncelleBoyutRozeti(); }
function yenile(){ render(); }
const renderRadios=yenile, renderSlides=yenile, renderSlogans=yenile, renderStats=yenile;

function baslik(b,aciklama){
  return '<h2><span class="ico" style="background:'+b.renk+'">'+b.ikon+'</span> '+b.ad+'</h2>'
       + '<div class="desc">'+aciklama+'</div>';
}

function cizPanel(){
  const p=document.getElementById('panel');
  const b=bolumler().find(x=>x.id===st.bolum) || bolumler()[0];
  p.innerHTML = '<div class="card">' + (st.varlik==='site' ? panelSite(b) : panelRadyo(b,st.radyo)) + '</div>';
}

/* ============================================================
   BİÇİMLENDİRİLEBİLİR ALAN (WYSIWYG)
   Kullanıcı HTML görmez: kutu doğrudan sonucu gösterir, Enter satır
   atlar, renk anında uygulanır. Yazılan içerik kaydederken temiz
   HTML'e çevrilir (yalnız <br>, <b>, <i>, <span style="color:...">).
   ============================================================ */
const PALET = [
  ['#ff0007','Kırmızı (Fenomen)'],
  ['#f75843','Mercan'],
  ['#ffca11','Sarı (Boombox)'],
  ['#00bac5','Turkuaz'],
  ['#0081ba','Mavi (İstanbul FM)'],
  ['#ffffff','Beyaz']
];

function zenginAlan(id, etiket, deger, yol, max, araclar, coklu, ipucu){
  const gorunen = String(deger||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]*>/g,'').length;
  const sayac = max ? '<span class="lim">en fazla '+max+' karakter</span><span class="say" data-say>'+gorunen+'/'+max+'</span>' : '';
  const ARAC = { kalin:'<b>B</b>&nbsp;Kalın', temiz:'✕ Biçimi temizle' };
  const butonlar = araclar.filter(function(a){return a!=='satir';}).map(function(a){
    if(a==='renk') return palet(id);
    return '<button type="button" onmousedown="event.preventDefault()" onclick="yazArac(\''+id+'\',\''+a+'\')">'+ARAC[a]+'</button>';
  }).join('');
  const cokSatir = araclar.indexOf('satir')>=0;
  return '<div class="field"><label>'+etiket+sayac+'</label>'
    + '<div class="arac">'+butonlar+'</div>'
    + '<div class="yaz'+(coklu?' uzun':'')+'" id="'+id+'" contenteditable="true" spellcheck="false"'
    +   ' data-yol="'+att(yol)+'"'+(max?' data-max="'+max+'"':'')+(cokSatir?' data-satir="1"':'')
    +   ' data-baslangic="'+att(deger)+'"></div>'
    + '<div class="hint">'+(cokSatir?'Alt satıra geçmek için <b>Enter</b>’a bas. ':'')
    +   (ipucu||'Kelimeyi seç, sonra bir renk yuvarlağına ya da <b>B</b>’ye bas.')+'</div>'
    + '</div>';
}

function palet(id){
  const kutular = PALET.map(function(r){
    return '<button type="button" class="swatch" style="background:'+r[0]+'" title="'+r[1]+'" '
         + 'onmousedown="event.preventDefault()" onclick="yazArac(\''+id+'\',\'renk\',\''+r[0]+'\')"></button>';
  }).join('');
  return '<span class="palet"><span class="plbl">🎨 Renk</span>'+kutular
       + '<button type="button" class="ozel" title="Başka bir renk seç" '
       + 'onmousedown="event.preventDefault();secimiSakla(\''+id+'\')" '
       + 'onclick="document.getElementById(\''+id+'_renk\').click()"></button>'
       + '<input type="color" id="'+id+'_renk" value="#ff0007" '
       + 'oninput="yazArac(\''+id+'\',\'renk\',this.value)"></span>';
}

/* --- seçimi sakla/geri yükle (renk seçici odağı çalıyor) --- */
let _secim=null;
function secimiSakla(){
  const s=window.getSelection();
  _secim = (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
}
function secimiGeriYukle(){
  if(!_secim) return;
  const s=window.getSelection(); s.removeAllRanges(); s.addRange(_secim);
}

/* --- araç uygula --- */
function yazArac(id,tip,deger){
  const el=document.getElementById(id); if(!el) return;
  el.focus();
  if(tip==='renk' && _secim){ secimiGeriYukle(); _secim=null; }
  try{ document.execCommand('styleWithCSS', false, tip==='renk'); }catch(e){}
  if(tip==='renk')       document.execCommand('foreColor', false, deger);
  else if(tip==='kalin') document.execCommand('bold');
  else if(tip==='temiz') document.execCommand('removeFormat');
  yazDegisti(el);
}

/* --- düzenlenen içeriği TEMİZ HTML'e çevir --- */
function seriHTML(kok){
  function kacir(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renkAl(n){
    if(n.style && n.style.color) return n.style.color;
    if(n.tagName==='FONT' && n.getAttribute('color')) return n.getAttribute('color');
    return '';
  }
  function kalinMi(n){
    if(n.tagName==='B'||n.tagName==='STRONG') return true;
    const w=n.style && n.style.fontWeight;
    return w==='bold' || (+w>=600);
  }
  function egikMi(n){
    return n.tagName==='I'||n.tagName==='EM' || (n.style && n.style.fontStyle==='italic');
  }
  function gez(n){
    let cikti='';
    for(let i=0;i<n.childNodes.length;i++){
      const c=n.childNodes[i];
      if(c.nodeType===3){ cikti+=kacir(c.nodeValue); continue; }
      if(c.nodeType!==1) continue;
      if(c.tagName==='BR'){ cikti+='<br>'; continue; }
      let ic=gez(c);
      if(!ic) continue;
      if(kalinMi(c)) ic='<b>'+ic+'</b>';
      if(egikMi(c))  ic='<i>'+ic+'</i>';
      const renk=renkAl(c);
      if(renk) ic='<span style="color:'+renk+'">'+ic+'</span>';
      /* contenteditable bazen DIV/P üretir — satır sonuna çevir */
      if((c.tagName==='DIV'||c.tagName==='P') && cikti && !/<br>$/.test(cikti)) cikti+='<br>';
      cikti+=ic;
    }
    return cikti;
  }
  return gez(kok).replace(/(<br>\s*)+$/,'');
}

function yazDegisti(el){
  const v=seriHTML(el);
  try{ yolYaz(el.getAttribute('data-yol'), v); }catch(e){}
  const s=el.closest('.field').querySelector('[data-say]');
  const max=+el.getAttribute('data-max');
  if(s && max){
    const n=el.textContent.length, asti=n>max;
    s.textContent=n+'/'+max;
    s.classList.toggle('asti',asti);
    s.classList.toggle('yakin',!asti && n>max*0.9);
    el.classList.toggle('asti',asti);
  }
}

/* --- editörleri kur (her render sonrası) --- */
function editorleriKur(){
  document.querySelectorAll('#panel .yaz[contenteditable]').forEach(function(el){
    /* Eski içerikteki sınıf tabanlı mavi (<span class="c">) satır içi renge
       çevrilir; yoksa ilk düzenlemede rengi kaybolurdu. */
    el.innerHTML = (el.getAttribute('data-baslangic') || '')
      .replace(/<span\s+class=["']c["']\s*>/gi, '<span style="color:#0081ba">');
    el.addEventListener('input', function(){ yazDegisti(el); });
    el.addEventListener('keydown', function(e){
      if(e.key!=='Enter') return;
      e.preventDefault();
      if(el.getAttribute('data-satir')) document.execCommand('insertLineBreak');
    });
    /* yapıştırmada dış biçimlendirme gelmesin — düz metin olarak al */
    el.addEventListener('paste', function(e){
      e.preventDefault();
      const t=(e.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, t);
    });
    yazDegisti(el);
  });
}

/* ==== KARAKTER SAYAÇLARI ==== */
function sayaclariKur(){
  document.querySelectorAll('#panel [data-max]').forEach(function(el){
    /* WYSIWYG kutuları (.yaz) kendi sayacını yazDegisti() ile yönetir —
       burada dokunma, div'de el.value yok, hata verir */
    if(el.isContentEditable) return;
    const max=+el.getAttribute('data-max');
    /* Sayaç YALNIZCA etiketli tek alanlarda (.field) gösterilir; etiketin sağında durur.
       Satır içi alanlara (frekans/yayıncı/akış/istatistik) kutu EKLENMEZ — eklenirse
       grid/flex satırının fazladan hücresi olup düzeni bozuyor. Orada uyarı,
       kutunun kırmızıya dönmesi + fare üstüne gelince çıkan ipucu ile veriliyor. */
    let s=null;
    const f=el.closest('.field');
    if(f && f.querySelectorAll('[data-max]').length===1) s=f.querySelector('label [data-say]');
    el.setAttribute('title','En fazla '+max+' karakter önerilir');

    const gorunenUzunluk=function(){
      /* biçimlendirilebilir alanlarda <b>, <br>, <span> gibi etiketler sayılmaz */
      return el.hasAttribute('data-html')
        ? el.value.replace(/<[^>]*>/g,'').length
        : el.value.length;
    };
    const guncelle=function(){
      const n=gorunenUzunluk(), asti=n>max, yakin=!asti && n>max*0.9;
      el.classList.toggle('asti', asti);
      if(s){
        s.textContent=n+'/'+max;
        s.classList.toggle('asti', asti);
        s.classList.toggle('yakin', yakin);
      }
    };
    el.addEventListener('input',guncelle); guncelle();
  });
}

/* Türkçe harfleri sadeleştirip adres dostu hâle getirir */
function temizSlug(metin){
  var tr={'ı':'i','İ':'i','ş':'s','Ş':'s','ğ':'g','Ğ':'g','ü':'u','Ü':'u','ö':'o','Ö':'o','ç':'c','Ç':'c','â':'a','î':'i','û':'u'};
  return String(metin||'')
    .replace(/[ıİşŞğĞüÜöÖçÇâîû]/g, function(c){ return tr[c] || c; })
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'-')
    .replace(/^-+|-+$/g,'')
    .slice(0,40);
}
/* İsim yazılırken sayfa adresi de otomatik türetilir — ama kullanıcı

}

/* ==== GÖRSEL YÜKLE + OPTİMİZE ==== */
function pickImage(cb,maxW,asPng){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(e){const f=e.target.files[0];if(!f)return;
    if(!f.type.startsWith('image/')){alert('Lütfen bir görsel dosyası seç.');return;}
    optimize(f,maxW||1600,asPng,cb);};
  inp.click();
}
/* WebP desteği var mı? (Safari 14+, Chrome, Edge, Firefox — hepsinde var)
   Desteklenmiyorsa toDataURL sessizce PNG döndürür, ondan anlıyoruz. */
var _webpVar=null;
function webpDestekli(){
  if(_webpVar===null){
    var t=document.createElement('canvas');t.width=t.height=1;
    _webpVar = t.toDataURL('image/webp').indexOf('data:image/webp')===0;
  }
  return _webpVar;
}
/* Görseli hem WebP hem klasik formatta kaydedip KÜÇÜK OLANI seçer.
   seffaf=true ise saydamlık korunur (logolar için). */
function enKucukKodla(c,seffaf){
  var klasik = seffaf ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.82);
  if(!webpDestekli()) return klasik;
  var webp = c.toDataURL('image/webp',0.82);
  return webp.length < klasik.length ? webp : klasik;
}
function optimize(file,maxW,seffaf,cb){
  const rd=new FileReader();
  rd.onload=function(){const img=new Image();
    img.onload=function(){
      let w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const ctx=c.getContext('2d');
      if(!seffaf){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);}  /* saydam PNG'ler siyah çıkmasın */
      ctx.drawImage(img,0,0,w,h);
      const url=enKucukKodla(c,seffaf);
      cb(url);
      toast('Görsel yüklendi ✓ '+w+'×'+h+' · '+bicimAdi(url)+' '+kbYazi(url.length)+' — Kaydet ile uygula');
      guncelleBoyutRozeti();
    };
    img.onerror=function(){alert('Görsel okunamadı.\n\niPhone HEIC dosyaları Chrome\'da açılmaz — JPG olarak kaydedip tekrar dene.');};
    img.src=rd.result;};
  rd.readAsDataURL(file);
}

/* ==== BOYUT GÖSTERGESİ ====
   İçeriğin tamamı tek bir JSON olarak Supabase'de duruyor ve siteyi açan
   HERKES her ziyarette bu JSON'u baştan indiriyor. Bu yüzden şişmemesi
   kritik. Ücretsiz plan (5 GB/ay) ile kaba karşılık:
     100 KB → ~50.000 ziyaret ·  500 KB → ~10.000 ·  1 MB → ~5.000
   Bütçe 500 KB kabul edildi; rozet doldukça sarı, sonra kırmızı yanar. */
var BOYUT_BUTCE = 500*1024;
function kbYazi(bayt){ return bayt<1024 ? bayt+' B'
  : bayt<1048576 ? Math.round(bayt/1024)+' KB'
  : (bayt/1048576).toFixed(1)+' MB'; }
function bicimAdi(url){
  var m=/^data:image\/(\w+)/.exec(url||''); return m ? m[1].toUpperCase() : 'bağlantı';
}
function icerikBoyutu(){ try{ return JSON.stringify(D).length; }catch(e){ return 0; } }
function guncelleBoyutRozeti(){
  var el=document.getElementById('boyutRozet'); if(!el) return;
  var n=icerikBoyutu(), oran=n/BOYUT_BUTCE;
  var durum = oran>1 ? 'kotu' : oran>0.6 ? 'orta' : 'iyi';
  el.className='rozet '+durum;
  el.textContent='İçerik: '+kbYazi(n)+' / '+kbYazi(BOYUT_BUTCE);
  el.title = oran>1
    ? 'Bütçe aşıldı! Panelden yüklenen görseller siteyi yavaşlatıyor ve aylık ziyaret kapasiteni düşürüyor. Büyük görselleri panel yerine logo/ klasörüne koyup git push yap.'
    : 'Supabase\'e giden içeriğin toplam boyutu. Her ziyaretçi bunu indiriyor — 500 KB altında tut.';
}

/* ==== KAYDET ==== */
function collect(){}   /* tüm alanlar anlık bağlı — toplamaya gerek yok */
function save(){
  var boyut=icerikBoyutu();
  if(boyut>BOYUT_BUTCE && !confirm(
      'Dikkat: içerik '+kbYazi(boyut)+' oldu (önerilen sınır '+kbYazi(BOYUT_BUTCE)+').\n\n'
    + 'Siteyi açan herkes bu içeriği baştan indiriyor. Bu boyutta site yavaşlar ve\n'
    + 'ücretsiz Supabase kotası ayda ~'+Math.round(5*1048576/(boyut/1024))+' ziyarette dolar.\n\n'
    + 'Çözüm: büyük görselleri panelden değil, logo/ klasörüne koyup git push ile yayınla.\n\n'
    + 'Yine de kaydedilsin mi?')) { return Promise.resolve(false); }
  try{ localStorage.setItem('bayrakstar_data',JSON.stringify(D)); }catch(err){}
  toast('Buluta gönderiliyor…');
  return window.BULUT.yaz(D).then(function(){
    toast('Buluta kaydedildi ✓ — site güncellendi'); return true;
  }).catch(function(e){
    alert('Buluta kaydedilemedi:\n\n'+e.message+'\n\nDeğişikliklerin kaybolmadı, bu tarayıcıda duruyor. '
        + 'İnternetini kontrol edip tekrar "Kaydet" de.');
    return false;
  });
}
function saveAndPreview(){save().then(function(ok){if(ok)window.open('index.html','_blank');});}
let _toastZaman=null;
function toast(msg,sure){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastGeri').style.display='none';
  t.classList.add('show');
  clearTimeout(_toastZaman);
  _toastZaman=setTimeout(function(){t.classList.remove('show');},sure||2400);
}

/* ============================================================
   SİLME KORUMASI
   Her silmede önce onay sorulur; silinen öge saklanır ve
   "↩ Geri al" ile aynı yerine geri konabilir.
   ============================================================ */
let _sonSilinen=null;

function silOge(diziYolu, index, ad){
  const dizi = yolOku(diziYolu);
  if(!Array.isArray(dizi) || !dizi[index]) return;
  const etiket = (ad && String(ad).trim()) ? '“'+ad+'”' : 'Bu kayıt';
  if(!confirm(etiket+' silinecek.\n\nEmin misin?')) return;
  _sonSilinen = { dizi:dizi, index:index, oge:dizi[index], ad:etiket };
  dizi.splice(index,1);
  yenile();
  toastGeriAlli(etiket+' silindi');
}

/* görsel/foto temizleme de geri alınabilir olsun */
function silDeger(yol, bosDeger, ad){
  const mevcut = yolOku(yol);
  if(!confirm((ad||'Görsel')+' kaldırılacak.\n\nEmin misin?')) return;
  _sonSilinen = { yol:yol, eski:mevcut, ad:ad||'Görsel' };
  try{ yolYaz(yol, bosDeger); }catch(e){}
  yenile();
  toastGeriAlli((ad||'Görsel')+' kaldırıldı');
}

function toastGeriAlli(msg){
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  document.getElementById('toastGeri').style.display='inline-block';
  t.classList.add('show');
  clearTimeout(_toastZaman);
  _toastZaman=setTimeout(function(){t.classList.remove('show');},9000);
}

function geriAl(){
  if(!_sonSilinen){ toast('Geri alınacak bir şey yok'); return; }
  const g=_sonSilinen; _sonSilinen=null;
  if(g.dizi) g.dizi.splice(g.index, 0, g.oge);          /* listeden silinen */
  else try{ yolYaz(g.yol, g.eski); }catch(e){}   /* temizlenen değer */
  yenile();
  toast(g.ad+' geri getirildi ✓');
}

function resetAll(){
  /* En tehlikeli işlem: yayındaki siteyi de geri alır ve GERİ ALINAMAZ.
     Bu yüzden çift onay + yazarak doğrulama istiyor. */
  if(!confirm('DİKKAT — bu işlem geri alınamaz.\n\n'
    + 'Panelde yaptığın TÜM düzenlemeler silinecek ve YAYINDAKİ site de\n'
    + 'ilk haline dönecek (ziyaretçiler de eski içeriği görecek).\n\n'
    + 'Devam etmek istiyor musun?')) return;
  const cevap=prompt('Son adım: onaylamak için aşağıya SIFIRLA yaz.\n\n'
    + 'İptal etmek için “İptal”e bas.\n'
    + 'İpucu: önce “⬇ JSON İndir” ile yedek alabilirsin.');
  if(cevap===null) return;
  if(cevap.trim().toLocaleUpperCase('tr-TR')!=='SIFIRLA'){ alert('Yazdığın metin eşleşmedi — hiçbir şey silinmedi.'); return; }
  localStorage.removeItem('bayrakstar_data');
  D=JSON.parse(JSON.stringify(window.DEFAULT_DATA));
  st={varlik:'site',radyo:0,bolum:'hero'};
  render();
  window.BULUT.yaz({}).then(function(){ toast('Varsayılana sıfırlandı (bulut dahil)'); })
  .catch(function(e){ alert('Bulut sıfırlanamadı: '+e.message); });
}

/* ==== JSON İNDİR / YÜKLE ==== */
function exportJson(){
  const content="/* Bu içeriği data.js dosyasındaki DEFAULT_DATA'nın yerine yapıştırarak yayına alabilirsin. */\nwindow.DEFAULT_DATA = "+JSON.stringify(D,null,2)+";";
  const blob=new Blob([content],{type:'text/javascript'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bayrakstar-icerik.js';a.click();
  toast('İndirildi — yedek olarak sakla');
}
function importJson(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.js,.json,application/json,text/javascript';
  inp.onchange=function(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=function(){try{
      const txt=rd.result;const m=txt.match(/\{[\s\S]*\}/);
      D=JSON.parse(m?m[0]:txt);
      st={varlik:'site',radyo:0,bolum:'hero'};
      render();toast('Yüklendi — Kaydet ile uygula');
    }catch(err){alert('Dosya okunamadı: '+err.message);}};
    rd.readAsText(f);};
  inp.click();
}

if(window.BULUT.girisliMi()){openPanel();}
